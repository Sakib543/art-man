<!doctype html>
<!--
  Shown by the service worker (public/sw.js) when a page cannot be loaded
  because the network is down (backlog P2.2a). It must stand on its own: no
  stylesheet, no script bundle and no font from the app, because none of them
  can be fetched when this page is needed. Only /logo.png, which the worker
  keeps beside it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No internet · Art Men's Salon</title>
    <style>
      :root {
        --background: #f4f5f7;
        --foreground: #101828;
        --muted: #475467;
        --primary: #15263d;
        --warning: #8a5a00;
        --warning-soft: #fff6e3;
        --warning-line: #f3dfb2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--background);
        color: var(--foreground);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 24px;
        border: 1px solid #e4e7ec;
        border-radius: 12px;
        background: #fff;
        text-align: center;
      }
      img {
        width: 120px;
        height: auto;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      .note {
        padding: 10px 12px;
        border: 1px solid var(--warning-line);
        border-radius: 8px;
        background: var(--warning-soft);
        color: var(--warning);
        text-align: left;
      }
      button {
        margin-top: 8px;
        height: 40px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Art Men's Salon" />
      <h1>No internet connection</h1>
      <p>The salon's system cannot be reached right now, so this page cannot be opened.</p>
      <p class="note">
        Keep writing bills in the paper bill book. When the internet is back, enter each one on the Billing
        screen with its book number, before Day Close.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back by itself as soon as the server answers again. The `online`
      // event alone is not enough: Wi-Fi with dead internet never fires it.
      // Same probe as src/lib/connectivity.ts; the worker does not cache it.
      async function retry() {
        try {
          await fetch("/manifest.webmanifest?probe=" + Date.now(), { method: "HEAD", cache: "no-store" });
          location.reload();
        } catch {
          setTimeout(retry, 5000);
        }
      }
      addEventListener("online", retry);
      setTimeout(retry, 5000);
    </script>
  </body>
</html>
