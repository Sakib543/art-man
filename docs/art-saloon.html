<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Art Men's Salon — POS preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #15263d;
        --navy-2: #24405f;
        --brass: #a67c45;
        --brass-50: #f8f1e6;
        --brass-100: #efe0c8;
        --brass-700: #7a5a2e;
        --bg: #f4f5f7;
        --surface: #ffffff;
        --line: #e3e6eb;
        --line-2: #eff1f4;
        --text: #101828;
        --text-2: #475467;
        --text-3: #6b7584;
        --green: #12795a;
        --green-50: #e9f6f0;
        --red: #b42318;
        --red-50: #fef1ef;
        --amber: #8a5a00;
        --amber-50: #fff6e3;
        --blue: #2e4c85;
        --blue-50: #eef3fb;
        --r: 10px;
        --r-lg: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        font-family:
          "IBM Plex Sans",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      .tnum {
        font-variant-numeric: tabular-nums;
      }

      svg.i {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }

      .demobar {
        background: var(--navy);
        color: #d5deea;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 20px;
        font-size: 13px;
        flex-wrap: wrap;
      }

      .demobar .l {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .demobar .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e0b870;
      }

      .demobar .r {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .seg-dark {
        display: flex;
        background: var(--navy-2);
        border-radius: 8px;
        padding: 3px;
      }

      .seg-dark button {
        border: 0;
        background: transparent;
        color: #b9c7d8;
        padding: 4px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }

      .seg-dark button.on {
        background: #fff;
        color: var(--navy);
        font-weight: 500;
      }

      .dbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #3b5577;
        background: transparent;
        color: #dce4ee;
        padding: 4px 10px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
      }

      .dbtn:hover {
        background: var(--navy-2);
      }

      .shell {
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        min-height: calc(100vh - 44px);
      }

      .side {
        background: var(--surface);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 18px 14px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 4px 8px 18px;
      }

      .mark {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--navy);
        color: #e6c58f;
        display: grid;
        place-items: center;
      }

      .mark svg {
        width: 20px;
        height: 20px;
      }

      .logo .n {
        font-weight: 600;
        font-size: 15px;
        line-height: 1.2;
      }

      .logo .s {
        font-size: 12.5px;
        color: var(--text-3);
      }

      .nav-sec {
        font-size: 12px;
        color: var(--text-3);
        padding: 14px 10px 6px;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        background: transparent;
        padding: 9px 10px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text-2);
        font-size: 14px;
        text-align: left;
        width: 100%;
      }

      .nav button:hover {
        background: var(--line-2);
        color: var(--text);
      }

      .nav button.on {
        background: var(--brass-50);
        color: var(--brass-700);
        font-weight: 500;
      }

      .nav button .lock {
        margin-left: auto;
        color: var(--text-3);
      }

      .nav button .lock svg {
        width: 15px;
        height: 15px;
      }

      .me {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 14px 8px 2px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--brass-100);
        color: var(--brass-700);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 13px;
        flex: none;
      }

      .me .n {
        font-weight: 500;
        font-size: 13.5px;
        line-height: 1.2;
      }

      .me .s {
        font-size: 12.5px;
        color: var(--text-3);
      }

      .main {
        padding: 22px 28px 90px;
        min-width: 0;
      }

      .ph {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .ph h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.2px;
      }

      .ph .sub {
        color: var(--text-3);
        margin-top: 3px;
        font-size: 13.5px;
      }

      .dayp {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 6px 5px 12px;
        font-size: 13px;
        color: var(--text-2);
      }

      .dayp svg {
        width: 16px;
        height: 16px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
      }

      .ch {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line-2);
      }

      .ch h2 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }

      .cb {
        padding: 16px 18px;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .g-pos {
        grid-template-columns: minmax(0, 1fr) 400px;
        align-items: start;
      }

      .g-2 {
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
        align-items: start;
      }

      .g-2e {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: start;
      }

      .g-kh {
        grid-template-columns: 300px minmax(0, 1fr);
        align-items: start;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 14px 16px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .stat .ic {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--line-2);
        color: var(--text-2);
        display: grid;
        place-items: center;
        flex: none;
      }

      .stat .k {
        font-size: 12.5px;
        color: var(--text-3);
      }

      .stat .v {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
        line-height: 1.25;
      }

      .stat .h {
        font-size: 12px;
        color: var(--text-3);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 500;
        padding: 2px 9px;
        border-radius: 999px;
        white-space: nowrap;
        line-height: 1.6;
      }

      .b-green {
        background: var(--green-50);
        color: var(--green);
      }

      .b-red {
        background: var(--red-50);
        color: var(--red);
      }

      .b-amber {
        background: var(--amber-50);
        color: var(--amber);
      }

      .b-grey {
        background: var(--line-2);
        color: var(--text-2);
      }

      .b-blue {
        background: var(--blue-50);
        color: var(--blue);
      }

      .b-brass {
        background: var(--brass-50);
        color: var(--brass-700);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
      }

      .btn:hover {
        background: var(--line-2);
      }

      .btn-p {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }

      .btn-p:hover {
        background: var(--navy-2);
      }

      .btn-sm {
        padding: 5px 10px;
        font-size: 13px;
      }

      .btn-lg {
        padding: 12px 16px;
        font-size: 15px;
        width: 100%;
      }

      .btn-ghost {
        border-color: transparent;
        background: transparent;
        color: var(--text-2);
      }

      .btn-danger {
        color: var(--red);
      }

      .btn svg {
        width: 16px;
        height: 16px;
      }

      label.l {
        display: block;
        font-size: 12.5px;
        color: var(--text-2);
        margin-bottom: 5px;
        font-weight: 500;
      }

      .inp,
      select.inp,
      textarea.inp {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 8px;
        padding: 8px 11px;
        font-size: 14px;
        transition: border-color 0.12s;
      }

      .inp:focus,
      select.inp:focus,
      textarea.inp:focus {
        outline: none;
        border-color: var(--brass);
        box-shadow: 0 0 0 3px var(--brass-50);
      }

      button:focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 2px;
      }

      .f {
        margin-bottom: 12px;
      }

      .iw {
        position: relative;
      }

      .iw svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--text-3);
      }

      .iw .inp {
        padding-left: 34px;
      }

      .err {
        color: var(--red);
        font-size: 12.5px;
        margin-top: 8px;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .help {
        font-size: 12.5px;
        color: var(--text-3);
      }

      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line-2);
        padding: 0 18px;
      }

      .tabs button {
        border: 0;
        background: transparent;
        padding: 11px 10px;
        cursor: pointer;
        color: var(--text-3);
        font-size: 14px;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }

      .tabs button.on {
        color: var(--text);
        border-color: var(--navy);
        font-weight: 500;
      }

      .tabs .cnt {
        font-size: 12px;
        color: var(--text-3);
        margin-left: 4px;
      }

      .seg {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        background: var(--line-2);
        border-radius: 9px;
        padding: 3px;
        gap: 2px;
      }

      .seg button {
        border: 0;
        background: transparent;
        padding: 7px 8px;
        border-radius: 7px;
        cursor: pointer;
        color: var(--text-2);
        font-size: 13.5px;
      }

      .seg button.on {
        background: #fff;
        color: var(--text);
        font-weight: 500;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
      }

      .svc {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
        padding: 16px 18px;
      }

      .svc button {
        text-align: left;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: var(--r);
        padding: 12px 13px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 92px;
        transition: border-color 0.12s;
      }

      .svc button:hover {
        border-color: var(--brass);
      }

      .svc .n {
        font-weight: 500;
      }

      .svc .m {
        font-size: 12.5px;
        color: var(--text-3);
        flex: 1;
      }

      .svc .p {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .svc .p b {
        font-weight: 600;
        font-size: 15px;
      }

      .cust {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--brass-100);
        background: var(--brass-50);
        border-radius: var(--r);
      }

      .cust .n {
        font-weight: 500;
      }

      .cust .s {
        font-size: 12.5px;
        color: var(--brass-700);
      }

      .recent {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
        align-items: center;
      }

      .recent button {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12.5px;
        cursor: pointer;
        color: var(--text-2);
      }

      .recent button:hover {
        border-color: var(--brass);
        color: var(--text);
      }

      .li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 128px 70px 26px;
        gap: 8px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line-2);
      }

      .li .n {
        font-weight: 500;
      }

      .li .m {
        font-size: 12px;
        color: var(--text-3);
      }

      .li select {
        padding: 5px 8px;
        font-size: 13px;
      }

      .li .a {
        text-align: right;
        font-weight: 500;
      }

      .icon-btn {
        border: 0;
        background: transparent;
        color: var(--text-3);
        cursor: pointer;
        padding: 3px;
        border-radius: 6px;
        display: grid;
        place-items: center;
      }

      .icon-btn:hover {
        background: var(--line-2);
        color: var(--red);
      }

      .icon-btn svg {
        width: 16px;
        height: 16px;
      }

      .grp {
        font-size: 12px;
        color: var(--brass-700);
        font-weight: 500;
        padding-top: 10px;
      }

      .empty {
        text-align: center;
        padding: 28px 10px;
        color: var(--text-3);
      }

      .empty svg {
        width: 28px;
        height: 28px;
        margin-bottom: 6px;
        color: #b7bec9;
      }

      .sum {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        color: var(--text-2);
      }

      .sum.t {
        color: var(--text);
        font-weight: 600;
        font-size: 20px;
        padding-top: 10px;
        border-top: 1px solid var(--line-2);
        margin-top: 6px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        text-align: left;
        font-weight: 500;
        color: var(--text-3);
        font-size: 12.5px;
        padding: 9px 14px;
        background: #fafbfc;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line-2);
        vertical-align: middle;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .r {
        text-align: right;
      }

      .c {
        text-align: center;
      }

      .neg {
        color: var(--red);
      }

      .pos {
        color: var(--green);
      }

      .muted {
        color: var(--text-3);
      }

      .sm {
        font-size: 12.5px;
      }

      .tot td {
        font-weight: 600;
        background: #fbf8f3;
      }

      .tbl-wrap {
        overflow-x: auto;
      }

      .stepper {
        display: flex;
        align-items: center;
        gap: 0;
        margin-bottom: 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 14px 18px;
        overflow-x: auto;
      }

      .st {
        display: flex;
        align-items: center;
        gap: 9px;
        white-space: nowrap;
        color: var(--text-3);
        font-size: 13.5px;
      }

      .st .cir {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        display: grid;
        place-items: center;
        font-size: 12.5px;
        font-weight: 600;
        background: #fff;
      }

      .st.on {
        color: var(--text);
        font-weight: 500;
      }

      .st.on .cir {
        border-color: var(--navy);
        color: var(--navy);
      }

      .st.done {
        color: var(--text-2);
      }

      .st.done .cir {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }

      .st.done .cir svg {
        width: 14px;
        height: 14px;
      }

      .bar {
        flex: 1;
        height: 1.5px;
        background: var(--line);
        margin: 0 12px;
        min-width: 20px;
      }

      .bar.done {
        background: var(--navy);
      }

      /* Day close: one big "cash in drawer" amount field */
      .cash-in {
        font-size: 26px;
        font-weight: 600;
        padding: 12px 14px;
        letter-spacing: -0.3px;
      }

      .hidden {
        border: 1px dashed #cbd1da;
        border-radius: var(--r);
        padding: 26px 16px;
        text-align: center;
        color: var(--text-3);
        background: #fbfbfc;
      }

      .hidden svg {
        width: 26px;
        height: 26px;
        color: #9aa3b0;
        margin-bottom: 6px;
      }

      .res {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .res .x {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 16px 18px;
      }

      .res .x .v {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.4px;
      }

      .res .short {
        background: var(--red-50);
        border-color: #f6d2cc;
      }

      .res .extra {
        background: var(--green-50);
        border-color: #c9e6d8;
      }

      .done-card {
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
        padding: 20px 22px;
      }

      .seal {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--green-50);
        color: var(--green);
        display: grid;
        place-items: center;
        flex: none;
      }

      .seal svg {
        width: 28px;
        height: 28px;
      }

      .code {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 2px;
        color: var(--navy);
        background: var(--line-2);
        border-radius: 8px;
        padding: 6px 12px;
        display: inline-block;
        margin-top: 6px;
      }

      .wa {
        background: #f1f8f3;
        border: 1px solid #d3e8da;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 13.5px;
        white-space: pre-line;
        max-width: 440px;
      }

      .list-staff button {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line-2);
        background: transparent;
        padding: 12px 16px;
        cursor: pointer;
      }

      .list-staff button:last-child {
        border-bottom: 0;
      }

      .list-staff button:hover {
        background: #fafbfc;
      }

      .list-staff button.on {
        background: var(--brass-50);
      }

      .list-staff .n {
        font-weight: 500;
      }

      .list-staff .s {
        font-size: 12.5px;

      const ic = (n, cls) =>
        `<svg class="i ${cls || ""}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

      // v2: business dates are ISO strings ("2026-09-11") so a second day can be closed.
      const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const MONL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const pad2 = (n) => String(n).padStart(2, "0");
      const dObj = (iso) => {
        const [y, m, d] = iso.split("-").map(Number);
        return new Date(y, m - 1, d);
      };
      const dShort = (iso) => dObj(iso).getDate() + " " + MON[dObj(iso).getMonth()];
      const dMed = (iso) => dShort(iso) + " " + dObj(iso).getFullYear();
      const dLong = (iso) => {
        const d = dObj(iso);
        return `${DOW[d.getDay()]}, ${d.getDate()} ${MONL[d.getMonth()]} ${d.getFullYear()}`;
      };
      const addDay = (iso) => {
        const d = dObj(iso);
        d.setDate(d.getDate() + 1);
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      };
      // Configuration records (staff, services, deals) are never hard-deleted,
      // only deactivated. Anything without active:false counts as active.
      const on = (x) => x.active !== false;
      // Commission % a staff member earns right now. Type 1 (monthly salary) earns none.
      const rateFor = (s) => (s.type === 1 ? 0 : s.rate);

      function freshClose(staff) {
        const present = {};
        staff.filter(on).forEach((s) => (present[s.id] = true));
        return {
          step: 1,
          present,
          payouts: null,
          pins: {},
          cash: "", // counted cash in drawer, one total amount
          reason: "",
          err: "",
          locked: false,
          code: "",
          wa: false,
        };
      }

      // Sample data: 1 to 10 September are already closed. Built from one small
      // table so the day snapshots, staff khata and Monthly report agree.
      function sampleMonth() {
        // date, sale, online, expenses, cash the Owner took, Sherry present
        const T = [
          ["2026-09-01", 27400, 5200, 1900, 2000, true],
          ["2026-09-02", 31200, 6400, 2300, 2000, true],
          ["2026-09-03", 24800, 4600, 1600, 1000, true],
          ["2026-09-04", 29600, 6000, 2100, 2000, true],
          ["2026-09-05", 26200, 5400, 1800, 1000, true],
          ["2026-09-06", 30800, 6800, 2400, 2000, true],
          ["2026-09-07", 25400, 4800, 1700, 1000, true],
          ["2026-09-08", 34600, 7600, 2600, 2000, true],
          ["2026-09-09", 23900, 4200, 1500, 1000, false],
          ["2026-09-10", 28300, 5800, 2000, 1000, true],
        ];
        const days = [];
        const com = { arshad: 0, hamid: 0 };
        const sherry = [];
        T.forEach(([date, sale, online, expense, ownerOut, sp]) => {
          const sh = sp ? Math.round((sale * 0.28) / 100) * 100 : 0;
          const ar = Math.round((sale * (sp ? 0.4 : 0.55)) / 100) * 100;
          const hm = sale - ar - sh;
          const c = { arshad: ar / 10, hamid: hm / 10, sherry: sh / 10 };
          com.arshad += c.arshad;
          com.hamid += c.hamid;
          const d = dShort(date);
          const sherryDay = sp ? 800 + c.sherry : 0;
          if (sp) {
            sherry.push([d, `Daily wage + commission (work ${fmt(sh)})`, sherryDay]);
            sherry.push([d, "Payment, PIN confirmed", -sherryDay]);
          }
          const bonus = date === "2026-09-08" ? 1000 : 0;
          if (bonus) sherry.push([d, "Bonus: weekend rush", 1000]);
          const staffEarned = c.arshad + c.hamid + c.sherry + (sp ? 800 : 0) + bonus;
          const staffPaid =
            sherryDay + (date === "2026-09-05" ? 2000 : 0) + (date === "2026-09-07" ? 3000 : 0);
          days.push({
            date,
            sale,
            cash: sale - online,
            online,
            expense,
            staffEarned,
            staffPaid,
            ownerOut,
            profit: sale - expense - staffEarned,
            short: 0,
          });
        });
        return {
          days,
          history: {
            arshad: [
              ["1 Sep", "Opening balance", 0],
              ["1–10 Sep", "Commission", com.arshad],
              ["5 Sep", "Payment", -2000],
            ],
            hamid: [
              ["1 Sep", "Opening balance", 0],
              ["1–10 Sep", "Commission", com.hamid],
              ["7 Sep", "Advance", -3000],
            ],
            sherry: [["1 Sep", "Opening balance", 0], ...sherry],
          },
        };
      }

      function calc() {
        const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);
        const cashSales = sum(S.bills, (b) => b.cash),
          onlineSales = sum(S.bills, (b) => b.online);
        const work = {},
          comRaw = {};
        S.staff.forEach((s) => {
          work[s.id] = 0;
          comRaw[s.id] = 0;
        });
        // Commission uses the % stored on each bill line (forward-only rate changes).
        S.bills.forEach((b) =>
          b.items.forEach((i) => {
            const r = i.rate != null ? i.rate : rateFor(staffBy(i.staff));
            work[i.staff] += i.amount;
            comRaw[i.staff] += (i.amount * r) / 100;
          }),
        );
        const earn = {};
        S.staff.forEach((s) => {
          const com = Math.round(comRaw[s.id]);
          const wage = s.type === 3 && S.close.present[s.id] ? s.wage : 0;
          earn[s.id] = { work: work[s.id], com, wage, total: com + wage };
        });
        const expDrawer = sum(
          S.entries.filter(
            (e) => e.type === "expense" && e.paidFrom === "drawer",
          ),
          (e) => e.amount,
        );
        const expOwner = sum(
          S.entries.filter(
            (e) => e.type === "expense" && e.paidFrom === "owner",
          ),
          (e) => e.amount,
        );
        const advances = sum(
          S.entries.filter((e) => e.type === "advance"),
          (e) => e.amount,
        );
        const ownerOut = sum(
          S.entries.filter((e) => e.type === "owner_out"),
          (e) => e.amount,
        );
        const ownerIn = sum(
          S.entries.filter((e) => e.type === "owner_in"),
          (e) => e.amount,
        );
        const payouts = S.close.payouts
          ? sum(Object.values(S.close.payouts), (v) => Number(v) || 0)
          : 0;
        const expected =
          S.opening +
          cashSales +
          ownerIn -
          expDrawer -
          advances -
          payouts -
          ownerOut;
        const counted = Math.round(Number(S.close.cash) || 0);
        // Day P&L (same rules as the monthly net profit): staff advances and
        // cash the Owner took are NOT expenses; staff earnings are.
        const bonusToday = sum(S.bonuses, (b) => b.amount);
        const staffEarned = sum(Object.values(earn), (e) => e.total) + bonusToday;
        const expTotal = expDrawer + expOwner;
        return {
          bonusToday,
          staffEarned,
          expTotal,
          profit: cashSales + onlineSales - expTotal - staffEarned,
          cashSales,
          onlineSales,
          total: cashSales + onlineSales,
          work,
          earn,
          expDrawer,
          expOwner,
          advances,
          ownerOut,
          ownerIn,
          payouts,
          expected,
          counted,
          cancels: S.bills.filter((b) => b.status === "cancelled").length,
          active: S.bills.filter((b) => b.status === "active").length,
        };
      }
