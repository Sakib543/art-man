        charge: () => {
          if (S.close.locked) {
            S.billErr =
              "Today is closed. Start the next business day to create bills.";
            return;
          }
          if (!S.cart.length) {
            S.billErr = "Add at least one service.";
            return;
          }
          if (S.cart.some((i) => !i.staff)) {
            S.billErr = "Select a staff member for every service.";
            return;
          }
          const t = S.cart.reduce((a, i) => a + i.amount, 0);
          let cash = 0,
            online = 0;
          if (S.payMode === "cash") cash = t;
          else if (S.payMode === "online") online = t;
          else {
            cash = Number(S.pay.cash) || 0;
            online = Number(S.pay.online) || 0;
            if (cash + online !== t) {
              S.billErr = `Cash and online must add up to ${rs(t)}.`;
              return;
            }
          }
          const no = nextNo();
          const bill = {
            no,
            time: now(),
            customer: S.customer ? S.customer.name : "Walk-in",
            items: S.cart.map((i) => ({
              name: i.name,
              amount: i.amount,
              staff: i.staff,
              rate: rateFor(staffBy(i.staff)), // forward-only: % frozen on the bill line
              deal: i.deal,
              note: i.note,
            })),
            cash,
            online,
            status: "active",
          };
          S.bills.push(bill);
          S.receipt = bill;
          S.cart = [];
          S.pay = { cash: "", online: "" };
          S.payMode = "cash";
          S.customer = null;
          S.custQuery = "";
          S.billErr = "";
        },
        closeReceipt: () => {
          S.receipt = null;
        },
        fFilter: (v) => {
          S.fFilter = v;
        },
        paidFrom: (v) => {
          S.form.paidFrom = v;
        },
        saveEntry: () => {
          const f = S.form,
            t = S.fType,
            amt = Number(f.amount);
          if (t === "expense" && !f.desc.trim()) {
            S.formErr = "Enter a description.";
            return;
          }
          if (!amt || amt < 1) {
            S.formErr = "Enter an amount.";
            return;
          }
          if (t !== "expense" && !/^\d{4}$/.test(f.pin)) {
            S.formErr = "Enter a 4-digit PIN to confirm.";
            return;
          }
          const e = {
            time: now(),
            type: t,
            amount: amt,
            desc:
              f.desc.trim() ||
              (t === "owner_in"
                ? "Change for the drawer"
                : t === "owner_out"
                  ? "Personal"
                  : "Advance"),
          };
          if (t === "expense") e.paidFrom = f.paidFrom;
          if (t === "advance") e.staff = f.staff;
          S.entries.push(e);
          S.form = {
            desc: "",
            amount: "",
            paidFrom: "drawer",
            staff: f.staff,
            pin: "",
          };
          S.formErr = "";
          toast("Entry saved");
        },
        cancelStart: (v) => {
          S.cancelling = Number(v);
          S.cancelReason = "";
          S.cancelErr = "";
        },
        cancelAbort: () => {
          S.cancelling = null;
        },
        cancelConfirm: (v) => {
          if (!S.cancelReason.trim()) {
            S.cancelErr = "A reason is required to cancel a bill.";
            return;
          }
          const b = S.bills.find((x) => x.no === Number(v));
          b.status = "cancelled";
          b.reason = S.cancelReason.trim();
          S.bills.push({
            no: nextNo(),
            time: now(),
            customer: b.customer,
            items: b.items.map((i) => ({
              name: "Reversal of #" + b.no,
              amount: -i.amount,
              staff: i.staff,
            })),
            cash: -b.cash,
            online: -b.online,
            status: "reversal",
            reverses: b.no,
          });
          S.cancelling = null;
          toast(`Bill #${b.no} cancelled and reversal added`);
        },
        next: () => {
          const cl = S.close;
          cl.err = "";
          if (cl.step === 3) {
            const c = calc();
            for (const s of S.staff) {
              const p = Number(cl.payouts[s.id]) || 0;
              const av = bal(s.id) + c.earn[s.id].total;
              if (p > av) {
                cl.err = `${s.name} can be paid up to ${rs(av)}. Record anything more as an advance.`;
                return;
              }
              if (p > 0 && !/^\d{4}$/.test(cl.pins[s.id] || "")) {
                cl.err = `${s.name} needs to enter a 4-digit PIN to confirm the payment.`;
                return;
              }
            }
          }
          cl.step++;
        },
        back: () => {
          S.close.err = "";
          S.close.step--;
        },
        countDone: () => {
          if (calc().counted <= 0) {
            S.close.err = "Enter the total cash in the drawer first.";
            return;
          }
          S.close.err = "";
          S.close.step = 5;
        },
        lockDay: () => {
          const c = calc();
          if (c.counted < c.expected && !S.close.reason.trim()) {
            S.close.err = "Cash is short. Enter a reason to close the day.";
            return;
          }
          const h = () =>
            Math.floor(Math.random() * 65536)
              .toString(16)
              .toUpperCase()
              .padStart(4, "0");
          Object.assign(S.close, {
            code: h() + "-" + h(),
            locked: true,
            lockedAt: now(),
            err: "",
          });
          // Store the per-day P&L snapshot; the Monthly report sums these rows.
          S.days = S.days.filter((d) => d.date !== S.date).concat(daySnapshot(calc()));
          toast("Day closed");
        },
        wa: () => {
          S.close.wa = !S.close.wa;
        },
        reopen: () => {
          // Owner reopen: the day leaves the monthly sums until it is closed again.
          S.days = S.days.filter((d) => d.date !== S.date);
          S.close.locked = false;
          S.close.step = 5;
          S.close.wa = false;
          toast("Day reopened and logged");
        },
        khata: (v) => {
          S.khata = v;
        },
        slip: () => toast("Sent"),
        giveBonus: () => {
          const b = S.bonus,
            a = Number(b.amount);
          if (!a || a < 1) {
            S.bonusErr = "Enter a bonus amount.";
            return;
          }
          if (!b.reason.trim()) {
            S.bonusErr = "Enter a reason for the bonus.";
            return;
          }
          S.bonuses.push({
            staff: b.staff,
            amount: a,
            reason: b.reason.trim(),
          });
          toast(`${rs(a)} bonus added to ${staffBy(b.staff).name}'s khata`);
          S.bonus = { staff: b.staff, amount: "", reason: "" };
          S.bonusErr = "";
        },
        monthClose: () => {
          const mn = monthName();
          // Month Close adds each salaried staff member's salary to the khata
          // (a money entry, written once) and freezes the monthly figures.
          S.staff
            .filter((s) => on(s) && s.type !== 3 && s.salary)
            .forEach((s) => S.history[s.id].push([dShort(S.date), "Monthly salary, " + mn, s.salary]));
          S.monthSnap = monthCalc();
          S.monthClosed = true;
          toast(mn + " closed");
        },
        reset: () => {
          // Reset restores seed state and always lands on Manager > Billing.
          S = seed();
          focusId = null;
          goTour(0);
          S.role = "manager";
          S.page = "billing";
          toast("Preview reset");
        },

        // ---- v2 actions ----
        // Start the next business day after Day Close: carry each khata forward and
        // archive today's bills and folder entries (kept, never deleted).
        nextDay: () => {
          if (!S.close.locked) return;
          const c = calc();
          S.staff.forEach((s) => {
            S.history[s.id] = khataRows(s.id).map((r) => [r.d, r.t, r.a]);
          });
          S.archive.push({ date: S.date, bills: S.bills, entries: S.entries, bonuses: S.bonuses, code: S.close.code });
          S.lastNo = nextNo() - 1;
          S.opening = c.counted;
          S.bills = [];
          S.entries = [];
          S.bonuses = [];
          S.date = addDay(S.date);
          S.close = freshClose(S.staff);
          S.cart = [];
          S.receipt = null;
          S.cancelling = null;
          S.quick = {};
          S.page = "billing";
          toast(dShort(S.date) + " started. Opening cash " + rs(c.counted));
        },
        quickPay: (v) => {
          S.quickPay = v;
        },
        stmt: (v) => {
          S.stmt = v;
        },
        stmtClose: () => {
          S.stmt = null;
        },
        print: () => {
          window.print();
        },
        editOpen: (v) => {
          const [kind, id] = v.split(":");
          const list = { staff: S.staff, service: S.services, deal: S.deals }[kind];
          const x = id ? list.find((y) => y.id === id) : null;
          const blank = {
            staff: { name: "", type: 3, salary: 0, wage: 700, rate: 10, pin: "", active: true },
            service: { name: "", cat: S.services[0].cat, newCat: "", price: "", active: true },
            deal: { name: "", price: "", items: [], active: true },
          }[kind];
          const d = x ? JSON.parse(JSON.stringify(x)) : blank;
          d.active = x ? on(x) : true;
          if (kind === "service") d.newCat = "";
          S.edit = { kind, id: id || null, d, err: "" };
        },
        editCancel: () => {
          S.edit = null;
        },
        editSave: () => {
          const e = S.edit,
            d = e.d;
          const n = String(d.name || "").trim();
          const num = (v) => Number(v) || 0;
          const fail = (m) => {
            e.err = m;
          };
          if (!n) return fail("Enter a name.");
          const list = { staff: S.staff, service: S.services, deal: S.deals }[e.kind];
          if (list.some((x) => x.id !== e.id && x.name.toLowerCase() === n.toLowerCase()))
            return fail("That name is already used.");
          let rec;
          if (e.kind === "staff") {
            const t = Number(d.type);
            if (t !== 3 && num(d.salary) <= 0) return fail("Enter the monthly salary.");
            if (t === 3 && num(d.wage) <= 0) return fail("Enter the daily wage.");
            if (t !== 1 && (d.rate === "" || num(d.rate) < 0 || num(d.rate) > 100))
              return fail("Commission must be 0 to 100%.");
            if (!/^\d{4}$/.test(d.pin || "")) return fail("Enter a 4-digit PIN.");
            rec = {
              name: n,
              type: t,
              salary: t === 3 ? 0 : num(d.salary),
              wage: t === 3 ? num(d.wage) : 0,
              rate: t === 1 ? 0 : num(d.rate),
              pin: d.pin,
              active: !!d.active,
            };
          } else if (e.kind === "service") {
            const cat = d.cat === "__new" ? String(d.newCat || "").trim() : d.cat;
            if (!cat) return fail("Enter the new category name.");
            if (num(d.price) <= 0) return fail("Enter a price.");
            rec = { name: n, cat, price: num(d.price), active: !!d.active };
          } else {
            if (num(d.price) <= 0) return fail("Enter the deal price.");
            if (d.items.length < 2) return fail("Choose at least two services.");
            rec = { name: n, price: num(d.price), items: d.items.slice(), active: !!d.active };
          }
          const when = dShort(S.date);
          const log = (text) => S.configLog.push({ date: when, time: now(), text });
          if (!e.id) {
            const id = e.kind[0] + Date.now().toString(36);
            if (e.kind === "service") rec.min = 20;
            list.push(Object.assign({ id }, rec));
            if (e.kind === "staff") {
              S.history[id] = [[when, "Opening balance", 0]];
              if (!S.close.locked) S.close.present[id] = true;
            }
            log(`${e.kind === "staff" ? "Staff" : e.kind === "service" ? "Service" : "Deal"} added: ${n}`);
            toast(n + " added");
          } else {
            const x = list.find((y) => y.id === e.id);
            const labels = { name: "name", type: "plan", salary: "salary", wage: "daily wage", rate: "commission %", pin: "PIN", cat: "category", price: "price", items: "services", active: "status" };
            const cur = (k) => (k === "active" ? on(x) : x[k]);
            const show = (k, v) =>
              k === "active" ? (v ? "active" : "inactive") : k === "pin" ? "••••" : k === "items" ? v.length + " services" : k === "type" ? "Type " + v : v;
            const ch = Object.keys(rec)
              .filter((k) => JSON.stringify(cur(k)) !== JSON.stringify(rec[k]))
              .map((k) => (k === "pin" ? "PIN changed" : `${labels[k]} ${show(k, cur(k))} → ${show(k, rec[k])}`));
            // Configuration edit: applies from today forward. Past bills keep their saved amount and %.
            Object.assign(x, rec);
            if (ch.length) log(`${n}: ${ch.join(", ")} (applies from ${when})`);
            toast(ch.length ? "Saved. Applies from today forward" : "No changes");
          }
          S.edit = null;
        },
        addFixed: () => {
          const ff = S.fixedForm;
          if (!ff.name.trim()) {
            S.mexpErr = "Enter a name for the fixed line.";
            return;
          }
          S.monthExp.fixed.push({ id: "f" + Date.now().toString(36), name: ff.name.trim(), amount: Number(ff.amount) || 0 });
          S.fixedForm = { name: "", amount: "" };
          S.mexpErr = "";
          toast("Fixed line added");
        },
        addOther: () => {
          const of = S.otherForm,
            a = Math.round(Number(of.amount));
          if (!a || a < 1) {
            S.otherErr = "Enter an amount.";
            return;
          }
          if (!of.reason.trim()) {
            S.otherErr = "A reason is required for every other expense.";
            return;
          }
          S.monthExp.others.push({ date: S.date, amount: a, reason: of.reason.trim(), void: false });
          S.otherForm = { amount: "", reason: "" };
          S.otherErr = "";
          toast(rs(a) + " expense added");
        },
        voidStart: (v) => {
          S.voiding = Number(v);
          S.voidReason = "";
          S.voidErr = "";
        },
        voidAbort: () => {
          S.voiding = null;
        },
        voidConfirm: (v) => {
          if (!S.voidReason.trim()) {
            S.voidErr = "A reason is required to void an entry.";
            return;
          }
          const o = S.monthExp.others[Number(v)];
          o.void = true;
          o.voidReason = S.voidReason.trim();
          S.voiding = null;
          toast("Entry voided. It stays on record");
        },
        addCapital: () => {
          const cf = S.capForm,
            cost = Math.round(Number(cf.cost));
          if (!cf.name.trim()) {
            S.capErr = "Enter a name, for example Solar system.";
            return;
          }
          if (!cost || cost < 1) {
            S.capErr = "Enter the total cost.";
            return;
          }
          const funders = S.partners
            .map((p) => ({ partner: p.id, amount: Math.round(Number(cf.funds[p.id]) || 0) }))
            .filter((x) => x.amount > 0);
          const given = sumBy(funders, (x) => x.amount);
          if (given !== cost) {
            S.capErr = `Contributions add up to ${rs(given)}. They must equal ${rs(cost)}.`;
            return;
          }
          S.capital.push({ id: "k" + Date.now().toString(36), name: cf.name.trim(), date: S.date, cost, funders, repayments: [] });
          S.capForm = { name: "", cost: "", funds: {} };
          S.capErr = "";
          toast(cf.name.trim() + " added as outstanding capital");
        },
        repay: (v) => {
          const k = S.capital.find((x) => x.id === v);
          const owed = k.funders.filter((f) => f.amount - capPaid(k, f.partner) > 0);
          if (!owed.length) return;
          const rp = S.repay[v] || (S.repay[v] = { partner: "", amount: "", note: "", err: "" });
          const pid = rp.partner && owed.some((f) => f.partner === rp.partner) ? rp.partner : owed[0].partner;
          const left = k.funders.find((f) => f.partner === pid).amount - capPaid(k, pid);
          const a = Math.round(Number(rp.amount));
          if (!a || a < 1) {
            rp.err = "Enter the installment amount.";
            return;
          }
          if (a > left) {
            rp.err = `Only ${rs(left)} is left to repay to ${partnerBy(pid).name}.`;
            return;
          }
          k.repayments.push({ date: S.date, partner: pid, amount: a, note: rp.note.trim() || "Installment " + (k.repayments.length + 1) });
          S.repay[v] = { partner: pid, amount: "", note: "", err: "" };
          toast(`${rs(a)} repaid. Remaining ${rs(k.cost - capPaid(k))}`);
        },
        pTab: (v) => {
          S.partnerTab = v;
        },
        addPartner: () => {
          if (!S.pDraft) S.pDraft = S.partners.map((p) => Object.assign({}, p));
          S.pDraft.push({ id: "p" + Date.now().toString(36), name: "Partner " + String.fromCharCode(65 + S.pDraft.length), share: 0 });
        },
        saveShares: () => {
          const d = S.pDraft;
          if (d.some((p) => !String(p.name).trim())) {
            S.pErr = "Every partner needs a name.";
            return;
          }
          const t = sumBy(d, (p) => Number(p.share) || 0);
          if (t !== 100) {
            S.pErr = `Shares add up to ${t}%. They must add up to 100%.`;
            return;
          }
          S.partners = d.map((p) => ({ id: p.id, name: String(p.name).trim(), share: Number(p.share) }));
          S.pDraft = null;
          S.pErr = "";
          S.configLog.push({ date: dShort(S.date), time: now(), text: "Profit shares: " + S.partners.map((p) => `${p.name} ${p.share}%`).join(", ") });
          toast("Profit shares saved");
        },
        addDraw: (v) => {
          const a = Math.round(Number(S.drawForm.amount));
          if (!a || a < 1) {
            S.drawErr = "Enter the amount drawn.";
            return;
          }
          S.drawings.push({ date: S.date, partner: v, amount: a, note: S.drawForm.note.trim() || "Profit drawing" });
          S.drawForm = { amount: "", note: "" };
          S.drawErr = "";
          toast(rs(a) + " drawing recorded");
        },
        tourOpen: () => {
          S.tourOpen = true;
          goTour(S.tour);
        },
        tourClose: () => {
          S.tourOpen = false;
          focusId = null;
        },
        tourNext: () => {
          if (S.tour === TOUR.length - 1) {
            S.tourOpen = false;
            focusId = null;
            S.tour = 0;
            return;
          }
          goTour(S.tour + 1);
        },
        tourPrev: () => {
          goTour(Math.max(0, S.tour - 1));
        },
        tourAct: () => {
          const a = TOUR[S.tour].act;
          if (a === "custDemo") {
            S.cart = [];
            applyCustomer(S.customers[0]);
            S.cat = "Hair";
            A.add("hc");
          }
          if (a === "allDemo") {
            if (S.cart.length < 2) {
              S.cat = "Hair";
              A.add("hc");
              A.add("bd");
            }
            S.cart.forEach((i) => (i.staff = "arshad"));
          }
          if (a === "dealDemo") {
            S.cat = "Deals";
            A.addDeal("vip");
          }
          if (a === "countDemo") {
            const c = calc();
            if (!S.close.locked) {
              S.close.payouts = {};
              S.staff.forEach(
                (s) =>
                  (S.close.payouts[s.id] =
                    s.type === 3 ? c.earn[s.id].total : 0),
              );
              S.close.pins = {};
              S.staff.forEach((s) => {
                if (S.close.payouts[s.id]) S.close.pins[s.id] = "1234";
              });
              S.close.cash = String(Math.max(0, calc().expected - 100));
              S.close.step = 5;
              S.close.err = "";
            }
          }
        },
      };

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-a]");
        if (!el) return;
        if (el.dataset.self && e.target !== el) return;
        A[el.dataset.a](el.dataset.v);
        render();
      });
      document.addEventListener("input", (e) => {
        const el = e.target,
          k = el.dataset.in;
        if (!k) return;
        const v = el.type === "checkbox" ? el.checked : el.value;
        if (k === "q") {
          S.q = v;
          const pos = el.selectionStart;
          render();
          const n = $("sq");
          if (n) {
            n.focus();
            n.setSelectionRange(pos, pos);
          }
          return;
        }
        if (k === "custQuery") {
          S.custQuery = v;
          S.custErr = "";
          if (v.replace(/\D/g, "").length === 11) {
            A.findCust();
            render();
          }
          return;
        }
        if (k === "cartStaff") {
          S.cart[Number(el.dataset.i)].staff = v;
          S.billErr = "";
          render();
          return;
        }
        // ---- v2 inputs ----
        if (k === "allStaff") {
          if (v) S.cart.forEach((i) => (i.staff = v));
          S.billErr = "";
          render();
          return;
        }
        if (k === "quick") {
          S.quick[el.dataset.v] = v;
          return;
        }
        if (k.startsWith("edit.")) {
          const fld = k.slice(5);
          S.edit.d[fld] = v;
          S.edit.err = "";
          if (fld === "type" || fld === "cat") renderLayer();
          return;
        }
        if (k === "editItem") {
          const it = S.edit.d.items;
          const i = it.indexOf(el.dataset.v);
          if (v && i < 0) it.push(el.dataset.v);
          if (!v && i >= 0) it.splice(i, 1);
          renderLayer();
          return;
        }
        if (k === "fixedAmt") {
          S.monthExp.fixed.find((x) => x.id === el.dataset.v).amount = Number(v) || 0;
          return;
        }
        if (k.startsWith("fixedForm.")) {
          S.fixedForm[k.slice(10)] = v;
          S.mexpErr = "";
          return;
        }
        if (k.startsWith("otherForm.")) {
          S.otherForm[k.slice(10)] = v;
          S.otherErr = "";
          return;
        }
        if (k === "voidReason") {
          S.voidReason = v;
          return;
        }
        if (k === "capForm.fund") {
          S.capForm.funds[el.dataset.v] = v;
          return;
        }
        if (k.startsWith("capForm.")) {
          S.capForm[k.slice(8)] = v;
          S.capErr = "";
          return;
        }
        if (k.startsWith("repay.")) {
          const r = S.repay[el.dataset.v] || (S.repay[el.dataset.v] = { partner: "", amount: "", note: "", err: "" });
          r[k.slice(6)] = v;
          r.err = "";
          return;
        }
        if (k === "pName" || k === "pShare") {
          S.pDraft[Number(el.dataset.v)][k === "pName" ? "name" : "share"] = v;
          S.pErr = "";
          return;
        }
        if (k.startsWith("drawForm.")) {
          S.drawForm[k.slice(9)] = v;
          S.drawErr = "";
          return;
        }
        if (k === "payCash" || k === "payOnline") {
          S.pay[k === "payCash" ? "cash" : "online"] = v;
          const pl = $("payLeft");
          if (pl)
            pl.textContent = payLeft(S.cart.reduce((a, i) => a + i.amount, 0));
          return;
        }
        if (k === "fType") {
          S.fType = v;
          S.formErr = "";
          render();
          return;
        }
        if (k.startsWith("form.")) {
          S.form[k.slice(5)] = v;
          S.formErr = "";
          if (k === "form.staff") render();
          return;
        }
        if (k.startsWith("bonus.")) {
          S.bonus[k.slice(6)] = v;
          S.bonusErr = "";
          return;
        }
        if (k === "present") {
          S.close.present[el.dataset.v] = v;
          S.close.payouts = null;
          return;
        }
        if (k === "payout") {
          S.close.payouts[el.dataset.v] = v;
          return;
        }
        if (k === "pin") {
          S.close.pins[el.dataset.v] = v;
          return;
        }
        if (k === "cashCount") {
          S.close.cash = v;
          S.close.err = "";
          return;
        }
        if (k === "reason") {
          S.close.reason = v;
          return;
        }
        if (k === "cancelReason") {
          S.cancelReason = v;
          return;
        }
      });
      // v2: totals that depend on typed numbers refresh when the field is left.
      document.addEventListener("change", (e) => {
        const k = e.target.dataset.in;
        if (k === "fixedAmt" || k === "pShare") render();
      });
      document.addEventListener("keydown", (e) => {
        const k = e.target.dataset && e.target.dataset.in;
        if (e.key === "Enter" && e.target.id === "cq") {
          A.findCust();
          render();
        }
        if (e.key === "Enter" && k === "cashCount") {
          A.countDone();
          render();
          return;
        }
        if (e.key === "Enter" && k === "quick") {
          e.preventDefault();
          quickAdd(e.target.dataset.v);
          return;
        }
        if (e.key === "Enter" && (k === "fixedAmt" || k === "pShare")) render();
        if (e.key === "Escape" && (S.receipt || S.edit || S.stmt)) {
          S.receipt = null;
          S.edit = null;
          S.stmt = null;
          render();
        }
      });

      goTour(0);
      render();
    </script>
  </body>
</html>
