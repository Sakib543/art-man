        <div class="sum t"><span>Total</span><span class="tnum">${rs(total)}</span></div>
        <div style="margin-top:14px"><label class="l">Payment</label>
          <div class="seg">${[
            ["cash", "Cash"],
            ["online", "Online (QR)"],
            ["split", "Split"],
          ]
            .map(
              ([k, n]) =>
                `<button data-a="payMode" data-v="${k}" class="${pm === k ? "on" : ""}">${n}</button>`,
            )
            .join("")}</div>${payFields}</div>
        ${S.billErr ? `<div class="err">${ic("alert")}${S.billErr}</div>` : ""}
        <button class="btn btn-p btn-lg" style="margin-top:14px" data-a="charge">${ic("printer")}Save and print ${total ? rs(total) : ""}</button>
      </div>
    </div>
  </div>`
        );
      };
      function nextNo() {
        return Math.max(S.lastNo || 0, ...S.bills.map((b) => b.no)) + 1;
      }
      function payLeft(total) {
        const p = (Number(S.pay.cash) || 0) + (Number(S.pay.online) || 0);
        if (!total) return "";
        if (p === total) return "Payment matches total";
        return p < total
          ? `Remaining ${rs(total - p)}`
          : `Over by ${rs(p - total)}`;
      }

      V.folders = () => {
        const c = calc();
        const f = S.form;
        const t = S.fType;
        const L = S.close.locked;
        const tt = {
          expense: "Expense",
          advance: "Staff advance",
          owner_out: "Owner took cash",
          owner_in: "Owner added cash",
        };
        let flds = "";
        if (t === "expense")
          flds = `<div class="f"><label class="l" for="fd">Description</label><input class="inp" id="fd" type="text" data-in="form.desc" value="${esc(f.desc)}" placeholder="Tea, lunch, towels"></div>
    <div class="f"><label class="l">Paid from</label><div class="seg"><button data-a="paidFrom" data-v="drawer" class="${f.paidFrom === "drawer" ? "on" : ""}">Cash drawer</button><button data-a="paidFrom" data-v="owner" class="${f.paidFrom === "owner" ? "on" : ""}">Owner's pocket or bank</button></div></div>`;
        else if (t === "advance")
          flds = `<div class="f"><label class="l" for="fs">Staff member</label><select class="inp" id="fs" data-in="form.staff">${activeStaff().map((s) => `<option value="${s.id}" ${f.staff === s.id ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>`;
        else
          flds = `<div class="f"><label class="l" for="fd">Purpose</label><input class="inp" id="fd" type="text" data-in="form.desc" value="${esc(f.desc)}" placeholder="${t === "owner_out" ? "Bank deposit" : "Change for the drawer"}"></div>`;
        const pinWho =
          t === "advance" ? staffBy(f.staff).name + "'s PIN" : "Owner's PIN";
        const typeBadge = (e) =>
          e.type === "expense"
            ? '<span class="badge b-grey">Expense</span>'
            : e.type === "advance"
              ? '<span class="badge b-brass">Staff</span>'
              : '<span class="badge b-blue">Owner</span>';
        const desc = (e) =>
          e.type === "expense"
            ? esc(e.desc) +
              (e.paidFrom === "owner"
                ? ' <span class="sm muted">(paid by Owner, not from drawer)</span>'
                : "")
            : e.type === "advance"
              ? "Advance to " + staffBy(e.staff).name
              : e.type === "owner_out"
                ? "Cash taken: " + esc(e.desc)
                : "Cash added: " + esc(e.desc);
        const filt = S.fFilter;
        const list = [];
        S.entries.forEach((e) => {
          if (
            filt === "all" ||
            (filt === "expense" && e.type === "expense") ||
            (filt === "staff" && e.type === "advance") ||
            (filt === "owner" && e.type.startsWith("owner"))
          )
            list.push({
              t: e.time,
              h: `<td>${typeBadge(e)}</td><td>${desc(e)}</td><td>${e.type === "expense" ? "" : '<span class="badge b-green">PIN confirmed</span>'}</td><td class="r tnum" style="font-weight:500">${fmt(e.amount)}</td>`,
            });
        });
        if (filt === "all" || filt === "online")
          S.bills
            .filter((b) => b.online !== 0)
            .forEach((b) =>
              list.push({
                t: b.time,
                h: `<td><span class="badge b-green">Online</span></td><td>Bill #${b.no}, ${esc(b.customer)} <span class="sm muted">(to Owner's bank)</span></td><td></td><td class="r tnum" style="font-weight:500">${fmt(b.online)}</td>`,
              }),
            );
        list.sort((a, b) => b.t.localeCompare(a.t));
        const rows = list.map(
          (x) => `<tr><td class="muted tnum">${x.t}</td>${x.h}</tr>`,
        );
        return (
          head(
            "Daily folders",
            "Expenses, staff advances, Owner cash and online payments for today",
          ) +
          `<div class="stats">
    ${stat("wallet", "Expenses from drawer", rs(c.expDrawer), "+ " + rs(c.expOwner) + " paid by Owner")}
    ${stat("users", "Staff advances", rs(c.advances), "PIN confirmed")}
    ${stat("user", "Owner took cash", rs(c.ownerOut), "Bank deposit")}
    ${stat("qr", "Online payments", rs(c.onlineSales), "Goes to Owner's bank")}
  </div>
  <div class="grid g-2">
    <div class="card"><div class="tabs">${[
      ["all", "All"],
      ["expense", "Expenses"],
      ["staff", "Staff"],
      ["owner", "Owner"],
      ["online", "Online"],
    ]
      .map(
        ([k, n]) =>
          `<button data-a="fFilter" data-v="${k}" class="${filt === k ? "on" : ""}">${n}</button>`,
      )
      .join("")}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Folder</th><th>Details</th><th></th><th class="r">Amount</th></tr></thead><tbody>${rows.join("") || '<tr><td colspan="5" class="empty">No entries yet</td></tr>'}</tbody></table></div></div>
    <div class="card" id="entryForm"><div class="ch"><h2>New entry</h2></div><div class="cb">
      ${
        L
          ? `<div class="alert a-brass" style="margin:0">${ic("lock")}<div>Today is closed. New entries go into the next business day.</div></div>`
          : `
      <div class="f"><label class="l" for="ft">Folder</label><select class="inp" id="ft" data-in="fType">${Object.entries(
        tt,
      )
        .map(
          ([k, v]) =>
            `<option value="${k}" ${t === k ? "selected" : ""}>${v}</option>`,
        )
        .join("")}</select></div>
      ${flds}
      <div class="f"><label class="l" for="fa">Amount (Rs)</label><input class="inp tnum" id="fa" type="number" min="1" step="1" data-in="form.amount" value="${f.amount}" placeholder="500"></div>
      ${t !== "expense" ? `<div class="f"><label class="l" for="fp">${pinWho} to confirm</label><input class="inp" id="fp" type="password" inputmode="numeric" maxlength="4" data-in="form.pin" value="${f.pin}" placeholder="4-digit PIN"><div class="help" style="margin-top:5px">The person receiving or giving cash confirms with their own PIN.</div></div>` : ""}
      ${S.formErr ? `<div class="err">${ic("alert")}${S.formErr}</div>` : ""}
      <button class="btn btn-p btn-lg" style="margin-top:6px" data-a="saveEntry">Save entry</button>`
      }
    </div></div>
  </div>`
        );
      };
      function stat(icn, k, v, h) {
        return `<div class="stat"><div class="ic">${ic(icn)}</div><div><div class="k">${k}</div><div class="v tnum">${v}</div>${h ? `<div class="h">${h}</div>` : ""}</div></div>`;
      }

      function khataRows(id) {
        const today = dShort(S.date);
        const rows = (S.history[id] || []).map((r) => ({ d: r[0], t: r[1], a: r[2] }));
        S.bonuses
          .filter((b) => b.staff === id)
          .forEach((b) =>
            rows.push({ d: today, t: "Bonus: " + b.reason, a: b.amount }),
          );
        S.entries
          .filter((e) => e.type === "advance" && e.staff === id)
          .forEach((e) =>
            rows.push({ d: today, t: "Advance", a: -e.amount }),
          );
        if (S.close.locked) {
          const e = calc().earn[id];
          if (e.com)
            rows.push({
              d: today,
              t: `Commission (on work of ${fmt(e.work)})`,
              a: e.com,
            });
          if (e.wage) rows.push({ d: today, t: "Daily wage", a: e.wage });
          const p = Number((S.close.payouts || {})[id]) || 0;
          if (p) rows.push({ d: today, t: "Payment, PIN confirmed", a: -p });
        }
        return rows;
      }
      const bal = (id) => khataRows(id).reduce((a, r) => a + r.a, 0);

      V.close = () => {
        const c = calc();
        const cl = S.close;
        const names = [
          "Attendance",
          "Staff earnings",
          "Staff payments",
          "Cash count",
          "Review and close",
        ];
        const cur = cl.locked ? 6 : cl.step;
        const stepper = `<div class="stepper">${names
          .map((n, i) => {
            const k = i + 1;
            const s = k < cur ? "done" : k === cur ? "on" : "";
            return (
              `<div class="st ${s}"><span class="cir">${k < cur ? ic("check") : k}</span><span class="lb">${n}</span></div>` +
              (k < 5 ? `<div class="bar ${k < cur ? "done" : ""}"></div>` : "")
            );
          })
          .join("")}</div>`;
        let body = "";
        const nav = (back, nextLbl, act) =>
          `<div class="cb" style="display:flex;justify-content:space-between;border-top:1px solid var(--line-2)">${back ? `<button class="btn" data-a="back">${ic("arrowL")}Back</button>` : "<span></span>"}<button class="btn btn-p" data-a="${act || "next"}">${nextLbl}${act === "lockDay" ? "" : ic("arrowR")}</button></div>`;
        if (cl.locked) body = closedView(c);
        else if (cl.step === 1)
          body = `<div class="card"><div class="ch"><h2>Who worked today?</h2></div><div class="tbl-wrap"><table><thead><tr><th>Staff</th><th>Pay type</th><th class="r">Work today</th><th class="c">Present</th></tr></thead><tbody>
    ${dayStaff(c).map((s) => `<tr><td><div style="display:flex;align-items:center;gap:10px"><div class="av">${initials(s.name)}</div>${s.name}</div></td><td class="muted">${typeLabel(s.type, s.rate)}</td><td class="r tnum">${rs(c.work[s.id])}</td><td class="c"><input type="checkbox" data-in="present" data-v="${s.id}" ${cl.present[s.id] ? "checked" : ""} aria-label="${s.name} present" style="width:17px;height:17px;accent-color:#15263D"></td></tr>`).join("")}
    </tbody></table></div><div class="cb help" style="border-top:1px solid var(--line-2)">Daily wage is paid only to staff on the daily wage plan who were present.</div>${nav(false, "Continue")}</div>`;
        else if (cl.step === 2)
          body = `<div class="card"><div class="ch"><h2>Earnings calculated from today's bills</h2><span class="badge b-grey">Automatic</span></div><div class="tbl-wrap"><table><thead><tr><th>Staff</th><th class="r">Work</th><th class="r">Commission</th><th class="r">Daily wage</th><th class="r">Earned today</th></tr></thead><tbody>
    ${dayStaff(c)
      .map((s) => {
        const e = c.earn[s.id];
        return `<tr><td>${s.name}<div class="sm muted">${typeLabel(s.type, s.rate)}</div></td><td class="r tnum">${fmt(e.work)}</td><td class="r tnum">${fmt(e.com)}</td><td class="r tnum">${e.wage ? fmt(e.wage) : '<span class="muted">—</span>'}</td><td class="r tnum" style="font-weight:600">${rs(e.total)}</td></tr>`;
      })
      .join("")}
    </tbody></table></div><div class="cb help" style="border-top:1px solid var(--line-2)">Cancelled bills and their reversals are already included, so nobody earns commission on a cancelled service.</div>${nav(true, "Continue")}</div>`;
        else if (cl.step === 3) {
          if (!cl.payouts) {
            cl.payouts = {};
            S.staff.forEach(
              (s) => (cl.payouts[s.id] = s.type === 3 ? c.earn[s.id].total : 0),
            );
          }
          body = `<div class="card"><div class="ch"><h2>Payments to staff today</h2></div><div class="tbl-wrap"><table><thead><tr><th>Staff</th><th class="r">Khata balance</th><th class="r">Earned today</th><th style="width:140px">Paid today</th><th style="width:130px">Staff PIN</th></tr></thead><tbody>
    ${dayStaff(c).map((s) => `<tr><td>${s.name}</td><td class="r tnum">${fmt(bal(s.id))}</td><td class="r tnum">${fmt(c.earn[s.id].total)}</td><td><input class="inp tnum" type="number" min="0" step="1" data-in="payout" data-v="${s.id}" value="${cl.payouts[s.id]}" aria-label="Paid to ${s.name}"></td><td><input class="inp" type="password" inputmode="numeric" maxlength="4" data-in="pin" data-v="${s.id}" value="${cl.pins[s.id] || ""}" placeholder="PIN" aria-label="${s.name} PIN"></td></tr>`).join("")}
    </tbody></table></div><div class="cb help" style="border-top:1px solid var(--line-2)">Anything not taken today stays in the staff member's khata and is paid with salary.${cl.err ? `<div class="err">${ic("alert")}${cl.err}</div>` : ""}</div>${nav(true, "Continue")}</div>`;
        } else if (cl.step === 4) {
          body = `<div class="grid g-2"><div class="card" id="countCard"><div class="ch"><h2>Cash in drawer</h2></div><div class="cb">
    <label class="l" for="cashIn">Total cash counted (Rs)</label>
    <input class="inp tnum cash-in" id="cashIn" type="number" inputmode="numeric" min="0" step="1" data-in="cashCount" value="${esc(cl.cash)}" placeholder="0" aria-label="Total cash counted in drawer">
    <div class="help" style="margin-top:8px">Drawer ka saara cash gin kar sirf total likhein, phir Enter dabayein.</div></div></div>
    <div class="card"><div class="ch"><h2>Expected cash</h2></div><div class="cb"><div class="hidden">${ic("lock")}<div style="font-weight:500;color:var(--text-2)">Hidden until the count is complete</div><div class="sm" style="margin-top:4px">The Manager counts first, so the count is honest and not adjusted to match.</div></div>
    ${cl.err ? `<div class="err">${ic("alert")}${cl.err}</div>` : ""}</div>${nav(true, "Count complete", "countDone")}</div></div>`;
        } else {
          const diff = c.counted - c.expected;
          const rows = [
            ["Opening cash (from yesterday)", S.opening],
            ["Cash sales", c.cashSales],
            ["Owner added cash", c.ownerIn],
            ["Expenses from drawer", -c.expDrawer],
            ["Staff advances", -c.advances],
            ["Staff payments today", -c.payouts],
            ["Owner took cash", -c.ownerOut],
          ];
          body = `<div class="res"><div class="x"><div class="muted sm">Expected</div><div class="v tnum">${rs(c.expected)}</div></div><div class="x"><div class="muted sm">Counted</div><div class="v tnum">${rs(c.counted)}</div></div>
      <div class="x ${diff < 0 ? "short" : diff > 0 ? "extra" : ""}"><div class="sm ${diff < 0 ? "neg" : diff > 0 ? "pos" : "muted"}">${diff < 0 ? "Short" : diff > 0 ? "Extra" : "Difference"}</div><div class="v tnum ${diff < 0 ? "neg" : diff > 0 ? "pos" : ""}">${rs(Math.abs(diff))}</div></div></div>
    <div class="grid g-2"><div class="card"><div class="ch"><h2>How expected cash is calculated</h2></div><table class="pl"><tbody>${rows.map((r) => `<tr><td>${r[0]}</td><td class="r tnum">${r[1] < 0 ? "−" + fmt(-r[1]) : r[1] > 0 ? "+" + fmt(r[1]) : "0"}</td></tr>`).join("")}<tr class="tot"><td>Expected cash in drawer</td><td class="r tnum">${rs(c.expected)}</td></tr></tbody></table>
      <div class="cb help" style="border-top:1px solid var(--line-2)">Online payments (${rs(c.onlineSales)}) are not included because they never enter the drawer.</div></div>
    <div class="card"><div class="ch"><h2>Close the day</h2></div><div class="cb">
      ${diff !== 0 ? `<label class="l" for="rsn">${diff < 0 ? "Reason for shortage (required)" : "Reason for extra cash"}</label><textarea class="inp" id="rsn" rows="3" data-in="reason" placeholder="${diff < 0 ? "Wrong change given to a customer" : "Customer left the change"}">${esc(cl.reason)}</textarea>` : `<div class="alert a-blue" style="margin:0">${ic("check")}<div>The drawer matches exactly.</div></div>`}
      ${cl.err ? `<div class="err">${ic("alert")}${cl.err}</div>` : ""}
      <p class="help" style="margin:12px 0 0">After closing, no entries can be added to today. Only the Owner can reopen a closed day.</p></div>
      <div class="cb" style="display:flex;justify-content:space-between;border-top:1px solid var(--line-2)"><button class="btn" data-a="back">${ic("arrowL")}Recount</button><button class="btn btn-p" data-a="lockDay">${ic("lock")}Close day</button></div></div></div>`;
        }
        return (
          head("Day close", "End-of-day cash check in five steps") +
          stepper +
          `<div id="closeArea">${body}</div>`
        );
      };

      function closedView(c) {
        const cl = S.close;
        const diff = c.counted - c.expected;
        const snap = S.days.find((d) => d.date === S.date) || daySnapshot(c);
        const msg = `Art Men's Salon: ${dMed(S.date)} closed\nSales ${rs(c.total)} (cash ${fmt(c.cashSales)}, online ${fmt(c.onlineSales)})\nExpenses ${rs(c.expDrawer)}\nDay profit ${rs(snap.profit)}\nPaid to staff ${rs(c.payouts + c.advances)}\nExpected ${rs(c.expected)}, counted ${rs(c.counted)}\n${diff < 0 ? "Short " + rs(-diff) + ": " + cl.reason : diff > 0 ? "Extra " + rs(diff) : "No difference"}\nCancelled bills: ${c.cancels}\nSecurity code ${cl.code}`;
        return `<div class="card"><div class="done-card"><div class="seal">${ic("shield")}</div><div style="flex:1;min-width:240px"><div style="font-weight:600;font-size:16px">Day closed at ${cl.lockedAt}</div><div class="muted">Security code sent with the daily summary. If any old entry is changed later, this code will no longer match.</div><div class="code">${cl.code}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="wa">${ic("msg")}${cl.wa ? "Hide summary" : "Preview WhatsApp summary"}</button>${S.role === "owner" ? `<button class="btn" data-a="reopen">${ic("undo")}Reopen day</button>` : ""}<button class="btn btn-p" data-a="nextDay">Start next business day${ic("arrowR")}</button></div></div>
    ${cl.wa ? `<div class="cb" style="border-top:1px solid var(--line-2)"><div class="help" style="margin-bottom:8px">Sent to the Owner on WhatsApp</div><div class="wa">${esc(msg)}</div></div>` : ""}</div>
  <div class="card" id="glance" style="margin-top:16px"><div class="ch"><h2>Today at a glance</h2><span class="badge b-brass">Saved for the monthly report</span></div>
    <div class="cb" style="padding-bottom:0"><div class="stats">${stat("trend", "Sale", rs(snap.sale), `Cash ${fmt(snap.cash)} + online ${fmt(snap.online)}`)}${stat("wallet", "Expenses", rs(snap.expense), "Drawer and Owner-paid")}${stat("users", "Staff salary / earnings", rs(snap.staffEarned), `Paid in hand today ${fmt(snap.staffPaid)}`)}${stat("chart", "Day profit", rs(snap.profit), "Sale − expenses − staff earnings")}</div></div>
    <div class="cb help" style="border-top:1px solid var(--line-2)">Staff advances and cash the Owner took are not expenses, so they do not reduce the day profit. Each closed day is one row in the Monthly report.</div></div>
  <div class="stats" style="margin-top:16px">${stat("cash", "Expected", rs(c.expected))}${stat("wallet", "Counted", rs(c.counted))}${stat("alert", diff < 0 ? "Short" : diff > 0 ? "Extra" : "Difference", rs(Math.abs(diff)), diff < 0 ? esc(cl.reason) : "")}${stat("clock", "Tomorrow's opening cash", rs(c.counted))}</div>
  ${S.role === "manager" ? '<p class="help">Only the Owner can reopen a closed day.</p>' : ""}`;
      }

      V.report = () => {
        const c = calc();
        const L = S.close.locked;
        const canCancel = S.role === "owner" || !L;
        const rows = S.bills
          .slice()
          .reverse()
          .map((b) => {
            const st =
              b.status === "cancelled"
                ? '<span class="badge b-red">Cancelled</span>'
                : b.status === "reversal"
                  ? '<span class="badge b-grey">Reversal</span>'
                  : '<span class="badge b-green">Paid</span>';
            const items = b.items
              .map(
                (i) =>
                  `${esc(i.name)}${i.deal ? ` <span class="muted">(${esc(i.deal)})</span>` : ""} <span class="badge b-grey" style="margin-left:4px">${staffBy(i.staff).name}</span>`,
              )
              .join("<br>");
            const pay = [
              b.cash ? "Cash " + fmt(b.cash) : "",
              b.online ? "Online " + fmt(b.online) : "",
            ]
              .filter(Boolean)
              .join("<br>");
            const amt = b.items.reduce((a, i) => a + i.amount, 0);
            const act =
              b.status === "active" && canCancel && S.cancelling !== b.no
                ? `<button class="btn btn-sm btn-danger" data-a="cancelStart" data-v="${b.no}">Cancel</button>`
                : "";
            let extra = "";
            if (S.cancelling === b.no)
              extra = `<tr><td colspan="6" style="background:#FDF7F6"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input class="inp" style="flex:1;min-width:220px" type="text" data-in="cancelReason" value="${esc(S.cancelReason)}" placeholder="Reason for cancelling (required)" aria-label="Reason for cancelling"><button class="btn btn-sm btn-danger" data-a="cancelConfirm" data-v="${b.no}">Confirm cancel</button><button class="btn btn-sm btn-ghost" data-a="cancelAbort">Keep bill</button></div>${S.cancelErr ? `<div class="err">${ic("alert")}${S.cancelErr}</div>` : ""}<div class="help" style="margin-top:6px">The bill is not deleted. A reversal entry is added and both stay on record.</div></td></tr>`;
            if (b.status === "cancelled" && b.reason)
              extra = `<tr><td></td><td colspan="5" class="sm muted" style="padding-top:0">Reason: ${esc(b.reason)}</td></tr>`;
            return (
              `<tr><td class="tnum" style="font-weight:500">#${b.no}<div class="sm muted">${b.time}</div></td><td>${esc(b.customer)}</td><td class="sm">${items}</td><td class="sm muted tnum">${pay}</td><td class="r tnum ${amt < 0 ? "neg" : ""}" style="font-weight:500">${fmt(amt)}</td><td class="r">${st}${act ? `<div style="margin-top:6px">${act}</div>` : ""}</td></tr>` +
              extra
            );
          })
          .join("");
        return (
          head(
            "Daily report",
            "All bills for today, including cancelled ones",
          ) +
          (c.cancels >= 3
            ? `<div class="alert a-amber">${ic("alert")}<div>${c.cancels} bills were cancelled today. The Owner has been alerted.</div></div>`
            : "") +
          (L && S.role === "manager"
            ? `<div class="alert a-brass">${ic("lock")}<div>Today is closed. Only the Owner can cancel a bill now.</div></div>`
            : "") +
          `<div class="stats">${stat("trend", "Total sales", rs(c.total))}${stat("cash", "Cash", rs(c.cashSales))}${stat("qr", "Online", rs(c.onlineSales))}${stat("receipt", "Paid bills", c.active)}${stat("undo", "Cancelled", c.cancels)}</div>
  <div class="card" id="billsTable"><div class="tbl-wrap"><table><thead><tr><th style="width:80px">Bill</th><th>Customer</th><th>Services and staff</th><th>Payment</th><th class="r">Amount</th><th class="r" style="width:130px">Status</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="cb help" style="border-top:1px solid var(--line-2)">Totals include every line, cancelled bills and reversals too. The mistake stays visible and the total stays correct.</div></div>`
        );
      };

      V.khata = () => {
        const s = staffBy(S.khata);
        const rows = khataRows(s.id);
        let run = 0;
        const body = rows
          .map((r) => {
            run += r.a;
            return `<tr><td class="muted">${r.d}</td><td>${esc(r.t)}</td><td class="r tnum ${r.a > 0 ? "pos" : r.a < 0 ? "neg" : ""}">${r.a > 0 ? "+" + fmt(r.a) : r.a < 0 ? fmt(r.a) : "0"}</td><td class="r tnum">${fmt(run)}</td></tr>`;
          })
          .join("");
        return (
          head(
            "Staff khata",
            "Earnings are added, payments and advances are subtracted",
          ) +
          (S.close.locked
            ? ""
            : `<div class="alert a-blue">${ic("info")}<div>Today's earnings and payments are added to the khata when the day is closed.</div></div>`) +
          `<div class="grid g-kh"><div class="card list-staff">${S.staff.map((x) => `<button data-a="khata" data-v="${x.id}" class="${S.khata === x.id ? "on" : ""}"><div class="av">${initials(x.name)}</div><div><div class="n">${x.name}</div><div class="s">${typeLabel(x.type, x.rate)}${on(x) ? "" : ' <span class="badge b-grey">Inactive</span>'}</div></div><span class="b tnum">${fmt(bal(x.id))}</span></button>`).join("")}</div>
  <div class="card" id="ledger"><div class="ch"><h2>${s.name}, ${monthName()} ${dObj(S.date).getFullYear()}</h2>${S.monthClosed ? '<span class="badge b-green">Final, month closed</span>' : '<span class="badge b-amber">Provisional until month close</span>'}</div>
  <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Details</th><th class="r">Amount</th><th class="r">Balance</th></tr></thead><tbody>${body}<tr class="tot"><td></td><td>Balance owed to ${s.name}</td><td></td><td class="r tnum">${rs(run)}</td></tr></tbody></table></div>
  <div class="cb" style="border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="help">${s.type !== 3 ? `Monthly salary of ${rs(s.salary)} is added at month end.` : "Daily wage and commission are added every night at day close."}</span>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm btn-p" data-a="stmt" data-v="${s.id}">${ic("receipt")}Monthly receipt</button><button class="btn btn-sm" data-a="slip">${ic("msg")}Send slip</button></div></div></div></div>`
        );
      };

      V.overview = () => {
        const c = calc();
        // v2: chart reads the stored day snapshots (closed days) plus today.
        const days = S.days
          .filter((d) => d.date !== S.date)
          .slice(-6)
          .map((d) => [dShort(d.date), d.sale])
          .concat([["Today", c.total]]);
        const n = days.length;
        const max = Math.max(...days.map((d) => d[1]), 1) * 1.12,
          W = 560,
          H = 190,
          bw = 44,
          gap = n > 1 ? (W - 40 - bw * n) / (n - 1) : 0;
        const bars = days
          .map((d, i) => {
            const h = Math.max(2, (d[1] / max) * (H - 40));
            const x = 30 + i * (bw + gap);
            const y = H - 24 - h;
            return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${i === n - 1 ? "#A67C45" : "#D9DEE6"}"/><text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="12" fill="#6B7584">${d[0]}</text><text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="11.5" fill="#475467">${(d[1] / 1000).toFixed(1)}k</text>`;
          })
          .join("");
        const drawer =
          S.opening +
          c.cashSales +
          c.ownerIn -
          c.expDrawer -
          c.advances -
          c.ownerOut -
          c.payouts;
        const feed = [];
        S.bills.forEach((b) =>
          feed.push({
            t: b.time,
            txt:
              b.status === "cancelled"
                ? `Bill #${b.no} cancelled`
                : b.status === "reversal"
                  ? `Reversal for #${b.reverses}`
                  : `Bill #${b.no} for ${esc(b.customer)}`,
            sub:
              b.status === "cancelled"
                ? "Reason: " + esc(b.reason)
                : rs(b.items.reduce((a, i) => a + i.amount, 0)),
            col:
              b.status === "cancelled"
                ? "#B42318"
                : b.status === "reversal"
                  ? "#98A2B3"
                  : "#12795A",
          }),
        );
        S.entries.forEach((e) =>
          feed.push({
            t: e.time,
            txt:
              e.type === "expense"
                ? `Expense: ${esc(e.desc)}`
                : e.type === "advance"
                  ? `Advance to ${staffBy(e.staff).name}`
                  : e.type === "owner_out"
                    ? `Owner took cash`
                    : "Owner added cash",
            sub: rs(e.amount),
            col: "#A67C45",
          }),
        );
        feed.sort((a, b) => b.t.localeCompare(a.t));
        return (
          head(
            "Overview",
            "Live view of the salon, available on the Owner's phone",
          ) +
          `<div class="stats" id="kpis">${stat("trend", "Sales today", rs(c.total), c.active + " bills paid")}${stat("cash", S.close.locked ? "Cash in drawer" : "Cash in drawer (expected)", rs(S.close.locked ? c.counted : drawer), S.close.locked ? "Counted at day close" : "Before day close")}${stat("qr", "Online to your bank", rs(c.onlineSales))}${stat("wallet", "Expenses today", rs(c.expDrawer + c.expOwner))}</div>
  <div class="grid g-2"><div class="card"><div class="ch"><h2>Sales, last 7 days</h2><span class="help">Rs</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales for the last 7 days">${bars}</svg></div></div>
  <div class="card"><div class="ch"><h2>Alerts</h2></div><div class="cb">
    <div class="alert a-amber" style="margin-bottom:10px">${ic("undo")}<div>${c.cancels} bill${c.cancels === 1 ? "" : "s"} cancelled today. Reason recorded for each.</div></div>
    ${S.entries
      .filter((e) => e.type === "advance")
      .map((e) => `<div class="alert a-blue" style="margin-bottom:10px">${ic("user")}<div>${staffBy(e.staff).name} took an advance of ${rs(e.amount)}.</div></div>`)
      .join("")}
    ${S.close.locked ? `<div class="alert ${c.counted < c.expected ? "a-amber" : "a-blue"}" style="margin:0">${ic("shield")}<div>Day closed. ${c.counted < c.expected ? "Short " + rs(c.expected - c.counted) + ": " + esc(S.close.reason) : "Cash matched."}</div></div>` : `<div class="alert a-brass" style="margin:0">${ic("clock")}<div>Day is still open. Close expected after 11 pm.</div></div>`}
  </div></div></div>
  <div class="card feed" style="margin-top:16px"><div class="ch"><h2>Today's activity</h2></div>${feed
    .slice(0, 8)
    .map(
      (f) =>
        `<div class="it"><span class="dt" style="background:${f.col}"></span><div style="flex:1"><div class="t">${f.txt}</div><div class="s">${f.sub}</div></div><span class="s tnum">${f.t}</span></div>`,
    )
    .join("")}</div>`
        );
      };

      // ---------------------------------------------------------------
      // v2: Daily worksheet, the salon's paper register as a live grid.
      // It only READS today's bills (no separate data store). Quick add
      // writes a normal minimal bill, so commission and Day Close stay correct.
      // ---------------------------------------------------------------
      V.sheet = () => {
        const c = calc();
        const L = S.close.locked;
        const cols = dayStaff(c);
        const cell = {};
        cols.forEach((s) => (cell[s.id] = []));
        S.bills.forEach((b) =>
          b.items.forEach((i) => {
            if (cell[i.staff]) cell[i.staff].push({ a: i.amount, no: b.no, n: i.name, st: b.status });
          }),
        );
        const own = S.bills
          .filter((b) => b.online !== 0)
          .map((b) => ({ a: b.online, no: b.no, n: "Online", st: b.status }));
        const rowsN = Math.max(1, own.length, ...cols.map((s) => cell[s.id].length));
        const cellHtml = (x) =>
          x
            ? `<div class="tnum ${x.st === "cancelled" ? "muted strike" : ""} ${x.a < 0 ? "neg" : ""}" style="font-weight:500">${fmt(x.a)}</div><div class="sm muted">#${x.no} ${esc(x.n)}</div>`
            : "";
        let body = "";
        for (let r = 0; r < rowsN; r++)
          body += `<tr>${cols.map((s) => `<td>${cellHtml(cell[s.id][r])}</td>`).join("")}<td class="own">${cellHtml(own[r])}</td></tr>`;
        const qp = S.quickPay;
        return (
          head("Daily worksheet", "Today's bills as columns per person, like the paper register") +
          `<div class="alert a-brass">${ic("book")}<div>Jaise aap register par likhte hain — har karigar ka apna column, neeche total.</div></div>` +
          (L
            ? `<div class="alert a-blue" style="align-items:center">${ic("lock")}<div style="flex:1">Today is closed. Quick add is off until the next business day starts.</div><button class="btn btn-sm" data-a="nextDay">Start next business day</button></div>`
            : "") +
          `<div class="card" id="sheetCard"><div class="ch" style="flex-wrap:wrap"><h2>${dLong(S.date)}</h2>
      <div style="display:flex;align-items:center;gap:8px"><span class="help">Quick add paid by</span><div class="seg" style="min-width:170px"><button data-a="quickPay" data-v="cash" class="${qp === "cash" ? "on" : ""}">Cash</button><button data-a="quickPay" data-v="online" class="${qp === "online" ? "on" : ""}">Online</button></div>
      <button class="btn btn-sm" data-a="go" data-v="billing">${ic("receipt")}Full bill</button></div></div>
    <div class="tbl-wrap"><table class="sheet"><thead><tr>${cols.map((s) => `<th class="r">${s.name}${on(s) ? "" : ' <span class="badge b-grey">Inactive</span>'}</th>`).join("")}<th class="r own">Owner / Account</th></tr>
    <tr class="qa">${cols.map((s) => `<td>${on(s) && !L ? `<input class="inp tnum" type="number" inputmode="numeric" min="1" step="1" data-in="quick" data-v="${s.id}" value="${esc(S.quick[s.id] || "")}" placeholder="+ amount, Enter" aria-label="Quick add for ${s.name}">` : ""}</td>`).join("")}<td class="own sm muted">Online bills land here</td></tr></thead>
    <tbody>${body}<tr class="tot">${cols.map((s) => `<td class="r tnum">${rs(c.work[s.id])}</td>`).join("")}<td class="r tnum own">${rs(c.onlineSales)}</td></tr></tbody></table></div>
    <div class="cb" style="border-top:1px solid var(--line-2)"><div class="sum t" style="border-top:0;margin-top:0;padding-top:0"><span>Grand total for the day</span><span class="tnum">${rs(c.total)}</span></div>
      <div class="sum"><span>Cash in drawer from sales</span><span class="tnum">${rs(c.cashSales)}</span></div>
      <div class="sum"><span>Owner / Account (online, straight to Saud Sahab)</span><span class="tnum">${rs(c.onlineSales)}</span></div>
      <div class="help" style="margin-top:6px">Grand total = all staff columns, and matches Total sales in the Daily report. The Owner / Account column is the online part of that total, not extra. Type an amount in a column and press Enter: it saves a small bill for that person. Cancelled amounts are struck through and their reversal is shown in minus.</div></div></div>`
        );
      };

      // v2: Monthly figures = sum of closed-day snapshots + monthly expenses.
      // Frozen into S.monthSnap at Month Close.
      function monthCalc() {
        const mk = monthKey();
        const days = S.days.filter((d) => d.date.startsWith(mk));
        const sales = sumBy(days, (d) => d.sale),
          cash = sumBy(days, (d) => d.cash),
          online = sumBy(days, (d) => d.online),
          dailyExp = sumBy(days, (d) => d.expense),
          staffEarned = sumBy(days, (d) => d.staffEarned),
          staffPaid = sumBy(days, (d) => d.staffPaid),
          ownerOut = sumBy(days, (d) => d.ownerOut),
          dayProfit = sumBy(days, (d) => d.profit);
        const fixed = sumBy(S.monthExp.fixed, (f) => Number(f.amount) || 0);
        const others = sumBy(S.monthExp.others.filter((o) => !o.void), (o) => o.amount);
        const salaries = sumBy(S.staff.filter((s) => on(s) && s.type !== 3), (s) => s.salary);
        // Net profit. NOT subtracted: staff advances, cash the Owner took,
        // partner capital and capital repayments.
        const net = sales - dailyExp - fixed - others - staffEarned - salaries;
        const repaid = sumBy(S.capital, (k) =>
          sumBy(k.repayments.filter((r) => r.date.startsWith(mk)), (r) => r.amount),
        );
        const ownerRecv = online + ownerOut;
        return {
          days: days.map((d) => Object.assign({}, d)),
          sales, cash, online, dailyExp, staffEarned, staffPaid, ownerOut, dayProfit,
          fixed, others, salaries, net, repaid, ownerRecv,
          balance: net - ownerRecv - repaid,
        };
      }
      const M = () => (S.monthClosed && S.monthSnap ? S.monthSnap : monthCalc());
      const minus = (n) => (n ? "−" + fmt(n) : "0");

      V.monthly = () => {
        const m = M();
        const mn = monthName();
        const todayOpen = !S.days.some((d) => d.date === S.date);
        const P = [
          [`Total sales (sum of ${m.days.length} closed days)`, fmt(m.sales)],
          ["Daily expenses (from day close)", minus(m.dailyExp)],
          ["Fixed monthly expenses (rent, electricity, bills, supplies)", minus(m.fixed)],
          ["Other expenses (with reason)", minus(m.others)],
          ["Staff earnings from day close (commission, wage, bonus)", minus(m.staffEarned)],
          ["Monthly salaries (Type 1 and 2 staff)", minus(m.salaries)],
        ];
        const dayRows = m.days
          .map(
            (d) =>
              `<tr><td>${dShort(d.date)}</td><td class="r tnum">${fmt(d.sale)}</td><td class="r tnum">${fmt(d.cash)}</td><td class="r tnum">${fmt(d.online)}</td><td class="r tnum">${fmt(d.expense)}</td><td class="r tnum">${fmt(d.staffEarned)}</td><td class="r tnum muted">${fmt(d.staffPaid)}</td><td class="r tnum ${d.profit < 0 ? "neg" : ""}" style="font-weight:500">${fmt(d.profit)}</td></tr>`,
          )
          .join("");
        return (
          head("Monthly report", `${mn} ${dObj(S.date).getFullYear()}, month to date. Built from closed days plus monthly expenses`) +
          (S.monthClosed
            ? `<div class="alert a-brass">${ic("lock")}<div>${mn} is closed and frozen. Any correction found later is added as an adjustment next month.</div></div>`
            : "") +
          `<div class="stats">${stat("trend", "Total sales", rs(m.sales), m.days.length + " closed days")}${stat("chart", "Net profit", rs(m.net))}${stat("user", "Received by Owner", rs(m.ownerRecv), `Online ${fmt(m.online)} + cash ${fmt(m.ownerOut)}`)}${stat("wallet", "Balance with business", rs(m.balance))}</div>
  <div class="grid g-2e"><div class="card"><div class="ch"><h2>Profit and loss</h2></div><table class="pl"><tbody>${P.map((l) => `<tr><td>${l[0]}</td><td class="r tnum">${l[1]}</td></tr>`).join("")}<tr class="tot"><td>Net profit</td><td class="r tnum">${rs(m.net)}</td></tr></tbody></table>
    <div class="cb help" style="border-top:1px solid var(--line-2)">Staff advances and cash taken by the Owner are not expenses, so they are not subtracted here. Partner capital and its repayments are not expenses either (see Capital / Outstanding).</div></div>
  <div class="card"><div class="ch"><h2>Owner account</h2></div><table class="pl"><tbody><tr><td>Net profit</td><td class="r tnum">${fmt(m.net)}</td></tr><tr><td>Online payments received in Owner's bank</td><td class="r tnum">${minus(m.online)}</td></tr><tr><td>Cash taken from drawer</td><td class="r tnum">${minus(m.ownerOut)}</td></tr><tr><td>Capital repaid to partners (not an expense)</td><td class="r tnum">${minus(m.repaid)}</td></tr><tr class="tot"><td>Balance with business</td><td class="r tnum">${rs(m.balance)}</td></tr></tbody></table>
    <div class="cb" style="border-top:1px solid var(--line-2)">${S.monthClosed ? '<span class="badge b-brass">Closed and frozen</span>' : `<button class="btn btn-p" data-a="monthClose">${ic("cal")}Close ${mn}</button><div class="help" style="margin-top:8px">Closing freezes the month, adds monthly salaries to the khata and makes staff receipts final.</div>`}</div></div></div>
  <div class="card" style="margin-top:16px" id="daysTable"><div class="ch"><h2>Closed days</h2><span class="help">From the Day close snapshot</span></div><div class="tbl-wrap"><table><thead><tr><th>Date</th><th class="r">Sale</th><th class="r">Cash</th><th class="r">Online</th><th class="r">Expenses</th><th class="r">Staff earned</th><th class="r">Staff paid</th><th class="r">Day profit</th></tr></thead><tbody>${dayRows}
    <tr class="tot"><td>Sum of ${m.days.length} days</td><td class="r tnum">${fmt(m.sales)}</td><td class="r tnum">${fmt(m.cash)}</td><td class="r tnum">${fmt(m.online)}</td><td class="r tnum">${fmt(m.dailyExp)}</td><td class="r tnum">${fmt(m.staffEarned)}</td><td class="r tnum">${fmt(m.staffPaid)}</td><td class="r tnum">${fmt(m.dayProfit)}</td></tr></tbody></table></div>
    <div class="cb help" style="border-top:1px solid var(--line-2)">Sum of day profits ${rs(m.dayProfit)} − fixed ${fmt(m.fixed)} − others ${fmt(m.others)} − salaries ${fmt(m.salaries)} = net profit ${rs(m.net)}.${todayOpen ? ` Today (${dShort(S.date)}) is added when the day is closed.` : ""}</div></div>`
        );
      };

      // v2: Monthly expenses (Owner only). Fixed lines = this month's bill amount,
      // editable until Month Close. "Others" are money entries: never edited or
      // deleted, only voided with a reason (and re-entered if needed).
      V.mexp = () => {
        const m = monthCalc();
        const F = S.monthClosed;
        const ff = S.fixedForm,
          of = S.otherForm;
        const fixedRows = S.monthExp.fixed
          .map(
            (f) =>
              `<tr><td>${esc(f.name)}${!Number(f.amount) ? ' <span class="badge b-amber">Not entered</span>' : ""}</td><td style="width:170px"><input class="inp tnum" type="number" inputmode="numeric" min="0" step="1" data-in="fixedAmt" data-v="${f.id}" value="${Number(f.amount) || ""}" placeholder="0" aria-label="${esc(f.name)} amount" ${F ? "disabled" : ""}></td></tr>`,
          )
          .join("");
        const otherRows = S.monthExp.others
          .map((o, idx) => {
            let r = `<tr class="${o.void ? "off" : ""}"><td class="muted">${dShort(o.date)}</td><td><span class="${o.void ? "strike" : ""}">${esc(o.reason)}</span>${o.void ? `<div class="sm"><span class="badge b-red">Voided</span> ${esc(o.voidReason)}</div>` : ""}</td><td class="r tnum ${o.void ? "strike" : ""}" style="font-weight:500">${fmt(o.amount)}</td><td class="r">${!o.void && !F && S.voiding !== idx ? `<button class="btn btn-sm btn-danger" data-a="voidStart" data-v="${idx}">Void</button>` : ""}</td></tr>`;
            if (S.voiding === idx)
              r += `<tr><td colspan="4" style="background:#FDF7F6"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input class="inp" style="flex:1;min-width:200px" type="text" data-in="voidReason" value="${esc(S.voidReason)}" placeholder="Reason for voiding (required)"><button class="btn btn-sm btn-danger" data-a="voidConfirm" data-v="${idx}">Confirm void</button><button class="btn btn-sm btn-ghost" data-a="voidAbort">Keep</button></div>${S.voidErr ? `<div class="err">${ic("alert")}${S.voidErr}</div>` : ""}<div class="help" style="margin-top:6px">The entry is not deleted. It stays visible as voided.</div></td></tr>`;
            return r;
          })
          .join("");
        return (
          head("Monthly expenses", `${monthName()} bills and one-off expenses. Owner only.`) +
          (F ? `<div class="alert a-brass">${ic("lock")}<div>${monthName()} is closed. Expenses are frozen.</div></div>` : "") +
          `<div class="stats">${stat("list", "Fixed monthly", rs(m.fixed))}${stat("wallet", "Others", rs(m.others))}${stat("receipt", "Monthly expenses total", rs(m.fixed + m.others), "Feeds the Monthly report")}${stat("chart", "Net profit (month to date)", rs(m.net))}</div>
  <div class="grid g-2e"><div class="card" id="fixedCard"><div class="ch"><h2>Fixed monthly</h2><span class="help">Rs</span></div><div class="tbl-wrap"><table><tbody>${fixedRows}<tr class="tot"><td>Total fixed</td><td class="r tnum">${rs(m.fixed)}</td></tr></tbody></table></div>
    ${F ? "" : `<div class="cb" style="border-top:1px solid var(--line-2)"><label class="l">Add a fixed line</label><div class="row-f"><div><input class="inp" type="text" data-in="fixedForm.name" value="${esc(ff.name)}" placeholder="Generator fuel" aria-label="Fixed line name"></div><div><input class="inp tnum" type="number" inputmode="numeric" min="0" step="1" data-in="fixedForm.amount" value="${ff.amount}" placeholder="Amount" aria-label="Amount"></div><button class="btn" data-a="addFixed">${ic("plus")}Add</button></div>${S.mexpErr ? `<div class="err">${ic("alert")}${S.mexpErr}</div>` : ""}<div class="help" style="margin-top:6px">Type the amount and press Enter or Tab. It can be corrected until the month is closed.</div></div>`}</div>
  <div class="card" id="othersCard"><div class="ch"><h2>Others</h2></div>
    ${F ? "" : `<div class="cb" style="border-bottom:1px solid var(--line-2)"><div class="row-f"><div style="flex:2"><label class="l" for="orr">Reason (required)</label><input class="inp" id="orr" type="text" data-in="otherForm.reason" value="${esc(of.reason)}" placeholder="Chair repair"></div><div><label class="l" for="ora">Amount (Rs)</label><input class="inp tnum" id="ora" type="number" inputmode="numeric" min="1" step="1" data-in="otherForm.amount" value="${of.amount}" placeholder="4000"></div><button class="btn btn-p" data-a="addOther">Add</button></div>${S.otherErr ? `<div class="err">${ic("alert")}${S.otherErr}</div>` : ""}</div>`}
    <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Reason</th><th class="r">Amount</th><th></th></tr></thead><tbody>${otherRows || '<tr><td colspan="4" class="empty">No other expenses yet</td></tr>'}<tr class="tot"><td></td><td>Total others</td><td class="r tnum">${rs(m.others)}</td><td></td></tr></tbody></table></div></div></div>`
        );
      };

      // v2: Capital / Outstanding (Owner only). A partner-funded investment is a
      // liability to that partner, repaid in installments from business cash.
      // It is NOT an operating expense and never changes net profit.
      // Investments and installments are money entries: append-only.
      const capPaid = (k, pid) =>
        sumBy(k.repayments.filter((r) => !pid || r.partner === pid), (r) => r.amount);
      const capIn = (k, pid) =>
        sumBy(k.funders.filter((f) => !pid || f.partner === pid), (f) => f.amount);
      const partnerBy = (id) => S.partners.find((p) => p.id === id) || { name: id };

      V.capital = () => {
        const tot = sumBy(S.capital, (k) => k.cost),
          paid = sumBy(S.capital, (k) => capPaid(k));
        const cf = S.capForm;
        const cards = S.capital
          .slice()
          .reverse()
          .map((k) => {
            const p = capPaid(k),
              left = k.cost - p;
            const rp = S.repay[k.id] || { partner: "", amount: "", note: "", err: "" };
            const owed = k.funders.filter((f) => f.amount - capPaid(k, f.partner) > 0);
            return `<div class="card" style="margin-bottom:16px"><div class="ch"><div><h2>${esc(k.name)}</h2><div class="sm muted">Added ${dShort(k.date)}</div></div>${left > 0 ? '<span class="badge b-amber">Outstanding</span>' : '<span class="badge b-green">Fully repaid</span>'}</div>
      <div class="cb" style="padding-bottom:0"><div class="res"><div class="x"><div class="muted sm">Total</div><div class="v tnum">${rs(k.cost)}</div></div><div class="x"><div class="muted sm">Paid back</div><div class="v tnum">${rs(p)}</div></div><div class="x ${left > 0 ? "short" : "extra"}"><div class="sm ${left > 0 ? "neg" : "pos"}">Remaining</div><div class="v tnum">${rs(left)}</div></div></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Funded by</th><th class="r">Contributed</th><th class="r">Paid back</th><th class="r">Remaining</th></tr></thead><tbody>${k.funders.map((f) => `<tr><td>${esc(partnerBy(f.partner).name)}</td><td class="r tnum">${fmt(f.amount)}</td><td class="r tnum">${fmt(capPaid(k, f.partner))}</td><td class="r tnum" style="font-weight:500">${fmt(f.amount - capPaid(k, f.partner))}</td></tr>`).join("")}</tbody></table></div>
      <div class="tbl-wrap" style="border-top:1px solid var(--line)"><table><thead><tr><th>Installment date</th><th>Paid to</th><th>Note</th><th class="r">Amount</th></tr></thead><tbody>${k.repayments.map((r) => `<tr><td class="muted">${dShort(r.date)}</td><td>${esc(partnerBy(r.partner).name)}</td><td>${esc(r.note)}</td><td class="r tnum">${fmt(r.amount)}</td></tr>`).join("") || '<tr><td colspan="4" class="empty">No installments yet</td></tr>'}</tbody></table></div>
      ${owed.length ? `<div class="cb" style="border-top:1px solid var(--line-2)"><label class="l">Record an installment</label><div class="row-f"><div><select class="inp" data-in="repay.partner" data-v="${k.id}" aria-label="Paid to">${owed.map((f) => `<option value="${f.partner}" ${rp.partner === f.partner ? "selected" : ""}>${esc(partnerBy(f.partner).name)}</option>`).join("")}</select></div><div><input class="inp tnum" type="number" inputmode="numeric" min="1" step="1" data-in="repay.amount" data-v="${k.id}" value="${rp.amount}" placeholder="Amount" aria-label="Installment amount"></div><div><input class="inp" type="text" data-in="repay.note" data-v="${k.id}" value="${esc(rp.note)}" placeholder="Installment ${k.repayments.length + 1}" aria-label="Note"></div><button class="btn btn-p" data-a="repay" data-v="${k.id}">Record</button></div>${rp.err ? `<div class="err">${ic("alert")}${rp.err}</div>` : ""}<div class="help" style="margin-top:6px">Paid from business cash. It lowers what the business owes the partner. It is not an expense and not profit.</div></div>` : ""}</div>`;
          })
          .join("");
        return (
          head("Capital / Outstanding", "Big one-off investments funded by partners and repaid in installments") +
          `<div class="alert a-blue">${ic("info")}<div>Ye kharcha nahi, capital hai: partner ne paisa lagaya, business kiston mein wapas karta hai. Is se mahine ka net profit kam nahi hota.</div></div>
  <div class="stats">${stat("landmark", "Total invested", rs(tot), S.capital.length + " investments")}${stat("cash", "Paid back", rs(paid))}${stat("alert", "Outstanding to partners", rs(tot - paid), "Liability, not an expense")}</div>
  <div class="grid g-2"><div>${cards || `<div class="card"><div class="empty">${ic("landmark")}<div>No investments yet</div></div></div>`}</div>
  <div class="card" id="capForm"><div class="ch"><h2>New investment</h2></div><div class="cb">
    <div class="f"><label class="l" for="cn">Name</label><input class="inp" id="cn" type="text" data-in="capForm.name" value="${esc(cf.name)}" placeholder="Solar system"></div>
    <div class="f"><label class="l" for="cc">Total cost (Rs)</label><input class="inp tnum" id="cc" type="number" inputmode="numeric" min="1" step="1" data-in="capForm.cost" value="${cf.cost}" placeholder="300000"></div>
    <label class="l">Who contributed how much</label>
    ${S.partners.map((p) => `<div class="f" style="display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:center"><span>${esc(p.name)}</span><input class="inp tnum" type="number" inputmode="numeric" min="0" step="1" data-in="capForm.fund" data-v="${p.id}" value="${cf.funds[p.id] || ""}" placeholder="0" aria-label="${esc(p.name)} contributed"></div>`).join("")}
    ${S.capErr ? `<div class="err">${ic("alert")}${S.capErr}</div>` : ""}
    <button class="btn btn-p btn-lg" style="margin-top:6px" data-a="addCapital">Add investment</button>
    <div class="help" style="margin-top:8px">Contributions must add up to the total cost.</div></div></div></div>`
        );
      };

      // v2: Partners (Owner only). Share % is configuration: editable, and it
      // recomputes the open month. A closed month keeps its frozen figures.
      function partnerAccount(p, m) {
        const profit = Math.round((m.net * p.share) / 100);
        const injected = sumBy(S.capital, (k) => capIn(k, p.id));
        const repaid = sumBy(S.capital, (k) => capPaid(k, p.id));
        const drawn = sumBy(S.drawings.filter((d) => d.partner === p.id), (d) => d.amount);
        return { profit, injected, repaid, owed: injected - repaid, drawn, net: profit + injected - repaid - drawn };
      }

      V.partners = () => {
        const m = M();
        if (!S.pDraft) S.pDraft = S.partners.map((p) => Object.assign({}, p));
        const totalPct = sumBy(S.pDraft, (p) => Number(p.share) || 0);
        const tab = S.partners.some((p) => p.id === S.partnerTab) ? S.partnerTab : "all";
        const tabs = `<div class="tabs"><button data-a="pTab" data-v="all" class="${tab === "all" ? "on" : ""}">All partners</button>${S.partners.map((p) => `<button data-a="pTab" data-v="${p.id}" class="${tab === p.id ? "on" : ""}">${esc(p.name)}</button>`).join("")}</div>`;
        let body;
        if (tab === "all") {
          body = `<div class="card" id="sharesCard"><div class="ch"><h2>Profit share</h2><span class="badge ${totalPct === 100 ? "b-green" : "b-red"}">Total ${totalPct}%</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Partner</th><th style="width:120px">Share %</th><th class="r">Share of net profit</th></tr></thead><tbody>
      ${S.pDraft.map((p, i) => `<tr><td><input class="inp" type="text" data-in="pName" data-v="${i}" value="${esc(p.name)}" aria-label="Partner name"></td><td><input class="inp tnum" type="number" inputmode="numeric" min="0" max="100" step="1" data-in="pShare" data-v="${i}" value="${p.share}" aria-label="${esc(p.name)} share"></td><td class="r tnum">${rs(Math.round((m.net * (Number(p.share) || 0)) / 100))}</td></tr>`).join("")}
      <tr class="tot"><td>Net profit, ${monthName()}</td><td class="tnum">${totalPct}%</td><td class="r tnum">${rs(m.net)}</td></tr></tbody></table></div>
      <div class="cb" style="border-top:1px solid var(--line-2)">${S.pErr ? `<div class="err" style="margin:0 0 10px">${ic("alert")}${S.pErr}</div>` : ""}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-p" data-a="saveShares">Save shares</button><button class="btn" data-a="addPartner">${ic("plus")}Add partner</button></div><div class="help" style="margin-top:8px">Shares must add up to 100%.</div></div></div>
    <div class="card" style="margin-top:16px"><div class="ch"><h2>Partner accounts</h2><span class="badge b-grey">Sample figures</span></div><div class="tbl-wrap"><table><thead><tr><th>Partner</th><th class="r">Share</th><th class="r">Profit share</th><th class="r">Capital injected</th><th class="r">Repaid</th><th class="r">Capital owed</th><th class="r">Drawn</th><th class="r">Net position</th></tr></thead><tbody>
      ${S.partners.map((p) => { const a = partnerAccount(p, m); return `<tr><td>${esc(p.name)}</td><td class="r tnum">${p.share}%</td><td class="r tnum">${fmt(a.profit)}</td><td class="r tnum">${fmt(a.injected)}</td><td class="r tnum">${fmt(a.repaid)}</td><td class="r tnum">${fmt(a.owed)}</td><td class="r tnum">${fmt(a.drawn)}</td><td class="r tnum" style="font-weight:600">${rs(a.net)}</td></tr>`; }).join("")}
      </tbody></table></div><div class="cb help" style="border-top:1px solid var(--line-2)">Net position = profit share + capital still owed − drawn. It is what the business owes the partner.</div></div>`;
        } else {
          const p = S.partners.find((x) => x.id === tab);
          const a = partnerAccount(p, m);
          const df = S.drawForm;
          const caps = S.capital.filter((k) => capIn(k, p.id));
          const draws = S.drawings.filter((d) => d.partner === p.id);
          body = `<div class="alert a-brass">${ic("pie")}<div>Your profit share = <b class="tnum">${p.share}%</b> of ${rs(m.net)} → <b class="tnum">${rs(a.profit)}</b></div></div>
    <div class="stats">${stat("chart", "Profit share", rs(a.profit), p.share + "% of net profit")}${stat("landmark", "Capital injected", rs(a.injected))}${stat("cash", "Repayments received", rs(a.repaid), "Capital owed " + fmt(a.owed))}${stat("wallet", "Net position", rs(a.net), "Business owes " + esc(p.name))}</div>
    <div class="grid g-2e"><div class="card"><div class="ch"><h2>Capital, separate from profit</h2></div><div class="tbl-wrap"><table><thead><tr><th>Investment</th><th class="r">Put in</th><th class="r">Repaid</th><th class="r">Owed back</th></tr></thead><tbody>
      ${caps.map((k) => `<tr><td>${esc(k.name)}</td><td class="r tnum">${fmt(capIn(k, p.id))}</td><td class="r tnum">${fmt(capPaid(k, p.id))}</td><td class="r tnum" style="font-weight:500">${fmt(capIn(k, p.id) - capPaid(k, p.id))}</td></tr>`).join("") || '<tr><td colspan="4" class="empty">No capital from this partner</td></tr>'}
      </tbody></table></div></div>
    <div class="card"><div class="ch"><h2>Profit drawn</h2></div><div class="cb" style="border-bottom:1px solid var(--line-2)"><div class="row-f"><div><input class="inp tnum" type="number" inputmode="numeric" min="1" step="1" data-in="drawForm.amount" value="${df.amount}" placeholder="Amount" aria-label="Amount drawn"></div><div><input class="inp" type="text" data-in="drawForm.note" value="${esc(df.note)}" placeholder="Note" aria-label="Note"></div><button class="btn btn-p" data-a="addDraw" data-v="${p.id}">Record</button></div>${S.drawErr ? `<div class="err">${ic("alert")}${S.drawErr}</div>` : ""}</div>
      <div class="tbl-wrap"><table><tbody>${draws.map((d) => `<tr><td class="muted">${dShort(d.date)}</td><td>${esc(d.note)}</td><td class="r tnum">${fmt(d.amount)}</td></tr>`).join("") || '<tr><td class="empty">Nothing drawn this month</td></tr>'}</tbody></table></div></div></div>`;
        }
        return (
          head("Partners", `${monthName()} ${dObj(S.date).getFullYear()}, sample figures. Profit comes from the Monthly report.`) +
          `<div class="card" style="margin-bottom:16px">${tabs}</div>${body}`
        );
      };

      // v2: Staff & rates, full add / edit / deactivate (Owner only).
      // AUDIT RULE: this is CONFIGURATION. It can be edited, but only applies
      // forward: bills keep the amount and commission % saved on each line,
      // closed days keep their snapshot, and the khata history never changes.
      // (Money ENTRIES such as bills, payments and cash movements are never
      // edited or deleted, only voided / reversed and re-entered.)
      // Nothing here is hard-deleted: deactivating hides it from new bills.
      V.setup = () => {
        const b = S.bonus;
        const edBtn = (kind, id) =>
          `<button class="btn btn-sm" data-a="editOpen" data-v="${kind}:${id}">${ic("edit")}Edit</button>`;
        const status = (x) => (on(x) ? '<span class="badge b-green">Active</span>' : '<span class="badge b-grey">Inactive</span>');
        return (
          head("Staff & rates", "Staff, services, deals and bonuses. Owner only.") +
          `<div class="grid g-2"><div style="display:grid;gap:16px;min-width:0">
    <div class="card" id="staffCard"><div class="ch"><h2>Staff pay plans</h2><button class="btn btn-sm btn-p" data-a="editOpen" data-v="staff:">${ic("plus")}Add staff</button></div><div class="tbl-wrap"><table><thead><tr><th>Staff</th><th>Plan</th><th class="r">Salary</th><th class="r">Daily wage</th><th class="r">Commission</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.staff.map((s) => `<tr class="${on(s) ? "" : "off"}"><td>${esc(s.name)}</td><td class="muted sm">${typeLabel(s.type, s.rate)}</td><td class="r tnum">${s.type !== 3 && s.salary ? fmt(s.salary) : '<span class="muted">—</span>'}</td><td class="r tnum">${s.type === 3 && s.wage ? fmt(s.wage) : '<span class="muted">—</span>'}</td><td class="r tnum">${s.type === 1 ? '<span class="muted">—</span>' : s.rate + "%"}</td><td>${status(s)}</td><td class="r">${edBtn("staff", s.id)}</td></tr>`).join("")}
    </tbody></table></div><div class="cb help" style="border-top:1px solid var(--line-2)">Changing a rate applies from that day forward. Past records stay as they were. Deactivated staff are hidden from new bills; their khata stays.</div></div>
    <div class="card" id="svcCard"><div class="ch"><h2>Service prices</h2><button class="btn btn-sm btn-p" data-a="editOpen" data-v="service:">${ic("plus")}Add service</button></div><div class="tbl-wrap"><table><thead><tr><th>Service</th><th>Category</th><th class="r">Price</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.services.map((s) => `<tr class="${on(s) ? "" : "off"}"><td>${esc(s.name)}</td><td class="muted">${esc(s.cat)}</td><td class="r tnum">${fmt(s.price)}</td><td>${status(s)}</td><td class="r">${edBtn("service", s.id)}</td></tr>`).join("")}
    <tr><td>Haircut for Ashfaq Bhai</td><td><span class="badge b-brass">Special rate</span></td><td class="r tnum">1,500</td><td></td><td></td></tr></tbody></table></div></div>
    <div class="card" id="dealCard"><div class="ch"><h2>Deals</h2><button class="btn btn-sm btn-p" data-a="editOpen" data-v="deal:">${ic("plus")}Add deal</button></div><div class="tbl-wrap"><table><thead><tr><th>Deal</th><th>Services included</th><th class="r">Deal price</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.deals.map((d) => `<tr class="${on(d) ? "" : "off"}"><td>${esc(d.name)}</td><td class="sm muted">${d.items.map((id) => esc(S.services.find((s) => s.id === id).name)).join(", ")}</td><td class="r tnum">${fmt(d.price)}</td><td>${status(d)}</td><td class="r">${edBtn("deal", d.id)}</td></tr>`).join("")}
    </tbody></table></div><div class="cb help" style="border-top:1px solid var(--line-2)">Deal price is split across its services by list price, so each staff member's commission is correct.</div></div>
  </div>
  <div style="display:grid;gap:16px;align-content:start;min-width:0">
  <div class="card"><div class="ch"><h2>Give a bonus</h2>${ic("gift")}</div><div class="cb">
    <div class="f"><label class="l" for="bs">Staff member</label><select class="inp" id="bs" data-in="bonus.staff">${activeStaff().map((s) => `<option value="${s.id}" ${b.staff === s.id ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>
    <div class="f"><label class="l" for="ba">Amount (Rs)</label><input class="inp tnum" id="ba" type="number" inputmode="numeric" min="1" step="1" data-in="bonus.amount" value="${b.amount}" placeholder="1000"></div>
    <div class="f"><label class="l" for="br">Reason</label><input class="inp" id="br" type="text" data-in="bonus.reason" value="${esc(b.reason)}" placeholder="Extra shift on Sunday"></div>
    ${S.bonusErr ? `<div class="err">${ic("alert")}${S.bonusErr}</div>` : ""}
    <button class="btn btn-p btn-lg" style="margin-top:4px" data-a="giveBonus">Add bonus</button>
    <div class="help" style="margin-top:8px">The bonus is added to the staff member's khata. It can be paid today or with salary.</div></div></div>
  <div class="card"><div class="ch"><h2>Settings change log</h2></div><div class="feed">${S.configLog
    .slice()
    .reverse()
    .map((l) => `<div class="it"><span class="dt" style="background:#A67C45"></span><div style="flex:1"><div class="t">${esc(l.text)}</div><div class="s">${l.date}, ${l.time}</div></div></div>`)
    .join("")}</div></div>
  </div></div>`
        );
      };

      // v2: add / edit modal for staff, services and deals (Staff & rates).
      function editModal() {
        const e = S.edit,
          d = e.d;
        const isNew = !e.id;
        const title = (isNew ? "Add " : "Edit ") + e.kind;
        let f = "";
        if (e.kind === "staff") {
          const t = Number(d.type);
          f = `<div class="f"><label class="l" for="en">Name</label><input class="inp" id="en" type="text" data-in="edit.name" value="${esc(d.name)}" placeholder="Bilal"></div>
      <div class="f"><label class="l" for="et">Pay plan</label><select class="inp" id="et" data-in="edit.type">${[1, 2, 3].map((k) => `<option value="${k}" ${t === k ? "selected" : ""}>Type ${k}: ${["Monthly salary", "Salary + commission", "Daily wage + commission"][k - 1]}</option>`).join("")}</select></div>
      <div class="row-f">${t !== 3 ? `<div class="f"><label class="l" for="es">Monthly salary (Rs)</label><input class="inp tnum" id="es" type="number" inputmode="numeric" min="0" step="1" data-in="edit.salary" value="${d.salary}"></div>` : ""}
      ${t === 3 ? `<div class="f"><label class="l" for="ew">Daily wage (Rs)</label><input class="inp tnum" id="ew" type="number" inputmode="numeric" min="0" step="1" data-in="edit.wage" value="${d.wage}"></div>` : ""}
      ${t !== 1 ? `<div class="f"><label class="l" for="er">Commission %</label><input class="inp tnum" id="er" type="number" inputmode="numeric" min="0" max="100" step="1" data-in="edit.rate" value="${d.rate}"></div>` : ""}</div>
      <div class="f"><label class="l" for="ep">4-digit PIN</label><input class="inp tnum" id="ep" type="password" inputmode="numeric" maxlength="4" data-in="edit.pin" value="${esc(d.pin)}" placeholder="PIN"><div class="help" style="margin-top:5px">Used by the staff member to confirm payments and advances.</div></div>`;
        } else if (e.kind === "service") {
          const cats = [...new Set(S.services.map((s) => s.cat))];
          f = `<div class="f"><label class="l" for="en">Name</label><input class="inp" id="en" type="text" data-in="edit.name" value="${esc(d.name)}" placeholder="Threading"></div>
      <div class="f"><label class="l" for="ec">Category</label><select class="inp" id="ec" data-in="edit.cat">${cats.map((c) => `<option ${d.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}<option value="__new" ${d.cat === "__new" ? "selected" : ""}>+ New category</option></select></div>
      ${d.cat === "__new" ? `<div class="f"><label class="l" for="enc">New category name</label><input class="inp" id="enc" type="text" data-in="edit.newCat" value="${esc(d.newCat)}" placeholder="Beard"></div>` : ""}
      <div class="f"><label class="l" for="epr">Price (Rs)</label><input class="inp tnum" id="epr" type="number" inputmode="numeric" min="1" step="1" data-in="edit.price" value="${d.price}" placeholder="250"></div>`;
        } else {
          const items = d.items.filter((id) => S.services.some((s) => s.id === id));
          const list = sumBy(items, (id) => S.services.find((s) => s.id === id).price);
          const price = Number(d.price) || 0;
          const preview =
            items.length && price
              ? splitDeal({ name: d.name, price, items }).map((x) => `${esc(x.name)} ${fmt(x.amount)}`).join(" · ")
              : "";
          f = `<div class="f"><label class="l" for="en">Name</label><input class="inp" id="en" type="text" data-in="edit.name" value="${esc(d.name)}" placeholder="Groom deal"></div>
      <div class="f"><label class="l" for="edp">Deal price (Rs)</label><input class="inp tnum" id="edp" type="number" inputmode="numeric" min="1" step="1" data-in="edit.price" value="${d.price}" placeholder="1500"></div>
      <label class="l">Services included</label><div style="border:1px solid var(--line);border-radius:8px;padding:4px 11px;margin-bottom:8px;max-height:220px;overflow:auto">${S.services
        .filter((s) => on(s) || items.includes(s.id))
        .map((s) => `<label class="chk"><input type="checkbox" data-in="editItem" data-v="${s.id}" ${items.includes(s.id) ? "checked" : ""}><span style="flex:1">${esc(s.name)}</span><span class="tnum muted">${fmt(s.price)}</span></label>`)
        .join("")}</div>
      <div class="help" style="margin-bottom:12px">List price total <span class="tnum">${rs(list)}</span>${preview ? `. Split by list price: <span class="tnum">${preview}</span>` : ""}</div>`;
        }
        f += `<label class="chk" style="margin-bottom:6px"><input type="checkbox" data-in="edit.active" ${d.active ? "checked" : ""}><span>Active</span></label>
      <div class="help">${e.kind === "staff" ? "Inactive staff are hidden from new bills. Their khata and past bills stay." : "Inactive items are hidden from Billing. Past bills stay as they were."}</div>
      ${!isNew ? `<div class="alert a-blue" style="margin:12px 0 0">${ic("info")}<div>Changing a rate applies from that day forward. Past records stay as they were.</div></div>` : ""}

      // v2: per-day P&L snapshot (a stored record written at Day Close).

      // v2: worksheet quick add. Creates a normal minimal same-day bill for that
      // person (named after a matching service price if there is one).
      function quickAdd(id) {
        const amt = Math.round(Number(S.quick[id]));
        if (S.close.locked || !amt || amt < 1) return;
        const s = staffBy(id);
        const svc = S.services.find((x) => on(x) && x.price === amt);
        const no = nextNo();
        S.bills.push({
          no,
          time: now(),
          customer: "Walk-in",
          items: [{ name: svc ? svc.name : "Service", amount: amt, staff: id, rate: rateFor(s), note: "Quick add" }],
          cash: S.quickPay === "cash" ? amt : 0,
          online: S.quickPay === "online" ? amt : 0,
          status: "active",
        });
        S.quick[id] = "";
        render();
        const n = document.querySelector('[data-in="quick"][data-v="' + id + '"]');
        if (n) n.focus();
        toast(`${rs(amt)} added to ${s.name}, bill #${no}`);
      }

      function splitDeal(d) {
        const items = d.items.map((id) => S.services.find((s) => s.id === id));
        const tot = items.reduce((a, s) => a + s.price, 0);
        const raw = items.map((s) => (s.price / tot) * d.price);
        const fl = raw.map(Math.floor);
        const left = d.price - fl.reduce((a, x) => a + x, 0);
        raw
          .map((r, i) => [r - fl[i], i])
          .sort((a, b) => b[0] - a[0])
          .slice(0, left)
          .forEach(([, i]) => fl[i]++);
        return items.map((s, i) => ({
          name: s.name,
          amount: fl[i],
          note: `Share of list price ${fmt(s.price)}`,
          staff: "",
          deal: d.name,
          dealPrice: d.price,
        }));
      }
      function applyCustomer(c) {
        S.customer = c;
        S.custErr = "";
        S.cart.forEach((i) => {
          const s = S.services.find((x) => x.name === i.name);
          if (!i.deal && s && c.special[s.id]) {
            i.amount = c.special[s.id];
            i.note = "Special rate";
          }
        });
      }

        payMode: (v) => {
