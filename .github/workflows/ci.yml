# Lint, test, build and the integration tests on every push to main and on
# every pull request; one job, "Deployable", says whether all of them passed.
#
# Why it exists: two developers work directly on `main`, in separate
# repositories, with no PR review — so until now nothing caught a bad push
# except the next person to pull (docs/HANDOFF.md section 2).
#
# No secrets and no environment variables are needed. `pnpm build` succeeds
# with none set — that is measured, and it is also why a green build proves
# nothing about the deployment (docs/DEPLOY_VERCEL.md). `pnpm test` is pure;
# `pnpm test:db` (backlog P7.9) runs against the PostgreSQL container below,
# which lives only as long as the job — never against live.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from "packageManager" in package.json, so the pinned
      # pnpm lives in one place only.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16.3.7 needs >= 20.9. Pinned to the LTS the deployment runs,
          # not to whatever is on a laptop.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheapest first. The working agreement runs build, test, lint in that
      # order locally; here the slowest step goes last so a broken push fails
      # in seconds rather than minutes.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      # The major version live runs on (Neon, PostgreSQL 18).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrates a template database, gives each test file a copy of it, and
      # drops them all at the end (tests/integration/global-setup.ts).
      - run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # The one check a deployment waits for (Vercel's Deployment Checks,
  # docs/DEPLOY_VERCEL.md). A job skipped because one it needs failed counts as
  # passed to GitHub, so this one always runs and fails unless both passed.
  deployable:
    name: Deployable
    needs: [verify, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Lint, test, build and the integration tests all passed
        run: |
          echo "Lint, test, build: ${{ needs.verify.result }}"
          echo "Integration tests: ${{ needs.integration.result }}"
          test "${{ needs.verify.result }}" = success
          test "${{ needs.integration.result }}" = success
