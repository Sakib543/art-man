# Lint, test and build on every push to main and on every pull request.
#
# Why it exists: two developers work directly on `main`, in separate
# repositories, with no PR review — so until now nothing caught a bad push
# except the next person to pull (docs/HANDOFF.md section 2).
#
# No secrets and no environment variables are needed. `pnpm build` succeeds
# with none set — that is measured, and it is also why a green build proves
# nothing about the deployment (docs/DEPLOY_VERCEL.md). The tests are pure and
# never touch a database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from "packageManager" in package.json, so the pinned
      # pnpm lives in one place only.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16.3.5 needs >= 20.9. Pinned to the LTS the deployment runs,
          # not to whatever is on a laptop.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheapest first. The working agreement runs build, test, lint in that
      # order locally; here the slowest step goes last so a broken push fails
      # in seconds rather than minutes.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
